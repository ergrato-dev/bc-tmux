    <rect x="728.0" y="73.0" width="69.0" height="42.0" rx="2" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="762.5" y="99.0" fill="#58a6ff" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text>
    <rect x="803.0" y="73.0" width="69.0" height="42.0" rx="2" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="837.5" y="99.0" fill="#58a6ff" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text>
    <rect x="728.0" y="121.0" width="69.0" height="42.0" rx="2" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="762.5" y="147.0" fill="#58a6ff" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2</text>
    <rect x="803.0" y="121.0" width="69.0" height="42.0" rx="2" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="837.5" y="147.0" fill="#58a6ff" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3</text>
    <text x="800" y="194" fill="#f78166" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">prefix Alt+5</text>
    <text x="450" y="240" fill="#8b949e" text-anchor="middle" font-size="13">En los layouts main-*, el panel principal es siempre el primero (0); su tamaño lo fijan main-pane-width y main-pane-height.</text>
    <text x="450" y="266" fill="#8b949e" text-anchor="middle" font-size="13">prefix Espacio recorre los cinco en este orden; prefix E reparte por igual sin cambiar la forma.</text>
