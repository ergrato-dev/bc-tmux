# ============================================================
# Lab 03 — Color de 24 bits (solución)
# Semana 08: Terminal, color y depuración
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s api
# No cambia el prefix: es C-b.
# ============================================================

# Sin la feature RGB, tmux traduce estos hex al color más cercano de 256.
set -g status-style 'bg=#161b22,fg=#3fb950'

# -u primero: sin él cada source-file añade otra copia de la entrada.
# Las features se leen al conectarse: tras cambiarlas, reconecta el cliente.
set -su terminal-features
set -sa terminal-features 'xterm*:RGB'
