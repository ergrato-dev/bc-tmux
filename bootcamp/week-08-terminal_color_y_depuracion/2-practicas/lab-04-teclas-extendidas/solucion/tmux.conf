# ============================================================
# Lab 04 — Teclas extendidas (solución)
# Semana 08: Terminal, color y depuración
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s api
# No cambia el prefix: es C-b.
# ============================================================

# Sin teclas extendidas, la terminal manda C-Enter igual que Enter (^M) y
# este binding no salta nunca.
bind -n C-Enter display-message 'C-Enter llegó'

# on: tmux las entiende y se las pasa solo a los programas que las piden.
# always se las manda a todos, y bash recibe basura en lugar de Enter.
set -s extended-keys on

# Sin extkeys, tmux no activa el modo en la terminal aunque extended-keys
# valga on. Se lee al conectarse: reconecta tras cambiarlo.
set -su terminal-features
set -sa terminal-features 'xterm*:extkeys'
