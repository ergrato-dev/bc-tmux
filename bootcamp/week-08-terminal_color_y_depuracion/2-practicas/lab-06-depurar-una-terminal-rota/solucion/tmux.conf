# ============================================================
# Lab 06 — Depurar una terminal rota (solución)
# Semana 08: Terminal, color y depuración
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s api
# No cambia el prefix: es C-b.
# ============================================================

# Fallo 1: xterm-256color dentro hacía que los programas esperaran las teclas
# de un xterm (Inicio = \EOH) y tmux manda las suyas. Solo afecta a paneles
# nuevos: tras arreglarlo, abre otro panel.
set -s default-terminal tmux-256color

# Fallos 2 y 3: "TC" no es ninguna capacidad (es Tc) y "xterm-265color" no
# casa con ningún TERM. tmux acepta los dos sin avisar. Una sola lista de
# features, con -u para que recargar no la duplique; se lee al conectarse.
set -su terminal-features
set -sa terminal-features 'xterm*:RGB:usstyle:extkeys'

# Fallo 4: 500 ms es lo que tmux espera tras un Esc para ver si es el inicio
# de una tecla (M-x llega como Esc + x). En local, 10 ms sobran.
set -s escape-time 10

# Fallo 5: con off, C-Enter llega como Enter y el binding nunca salta. Hace
# falta también extkeys en terminal-features (arriba).
set -s extended-keys on
bind -n C-Enter display-message 'C-Enter llegó'
