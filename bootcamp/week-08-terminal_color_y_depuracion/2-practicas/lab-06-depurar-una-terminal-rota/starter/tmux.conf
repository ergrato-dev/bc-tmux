# ============================================================
# Lab 06 — Depurar una terminal rota
# Semana 08: Terminal, color y depuración
# ROTA A PROPÓSITO: carga sin errores, pero tiene cinco fallos. Encuéntralos
# con el README; no te fíes de los comentarios.
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/starter/tmux.conf" new -d -s api
# No cambia el prefix: es C-b.
# ============================================================

# Que los programas sepan que la terminal tiene 256 colores.
set -g default-terminal xterm-256color

# Color de 24 bits para la terminal de siempre.
set -as terminal-overrides ',xterm-256color:TC'
set -as terminal-features 'xterm-265color:RGB:usstyle'

# Esc instantáneo al salir de los modos de los programas.
set -s escape-time 500

# C-Enter manda un aviso.
set -s extended-keys off
bind -n C-Enter display-message 'C-Enter llegó'
