# ============================================================
# Lab 05 — Passthrough y estilos (solución)
# Semana 08: Terminal, color y depuración
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s api
# No cambia el prefix: es C-b.
# ============================================================

# Riesgo: tmux no filtra lo que pasa; un programa del panel puede, por
# ejemplo, escribir en tu portapapeles saltándose set-clipboard. on solo deja
# pasar al panel visible; all también a los que no ves. Por defecto, off.
setw -g allow-passthrough on

# Sin usstyle, tmux cambia el subrayado ondulado (\e[4:3m) por uno recto.
# Se lee al conectarse: reconecta tras cambiarlo.
set -su terminal-features
set -sa terminal-features 'xterm*:usstyle'
