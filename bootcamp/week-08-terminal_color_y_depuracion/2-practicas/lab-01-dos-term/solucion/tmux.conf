# ============================================================
# Lab 01 — Dos TERM (solución)
# Semana 08: Terminal, color y depuración
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s api
# No cambia el prefix: es C-b.
# ============================================================

# TERM de dentro. Con xterm-256color los programas esperarían las teclas de un
# xterm (Inicio = \EOH) y tmux manda las suyas (\E[1~): Inicio y Fin fallan.
set -s default-terminal tmux-256color

# TERM de fuera: lo pone la terminal de cada cliente, por eso es client_*.
set -g status-right 'fuera: #{client_termname} '

bind T display-message 'fuera: #{client_termname} · dentro: #{default-terminal}'
