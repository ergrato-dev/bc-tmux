<svg viewBox="0 0 900 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Cadena terminal, cliente, servidor y panel: el TERM de fuera lo pone tu terminal y lo completa terminal-features; el TERM de dentro lo fija default-terminal</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#79c0ff"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- cajas -->
    <rect x="30" y="110" width="170" height="90" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="115" y="145" fill="#f0f6fc" text-anchor="middle" font-size="16">Tu terminal</text>
    <text x="115" y="170" fill="#8b949e" text-anchor="middle">emulador</text>

    <rect x="250" y="110" width="170" height="90" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="335" y="145" fill="#f0f6fc" text-anchor="middle" font-size="16">Cliente tmux</text>
    <text x="335" y="170" fill="#8b949e" text-anchor="middle">lee TERM al conectarse</text>

    <rect x="470" y="110" width="170" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="555" y="145" fill="#f0f6fc" text-anchor="middle" font-size="16">Servidor tmux</text>
    <text x="555" y="170" fill="#8b949e" text-anchor="middle">traduce en los dos sentidos</text>

    <rect x="690" y="110" width="180" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="780" y="145" fill="#f0f6fc" text-anchor="middle" font-size="16">Panel</text>
    <text x="780" y="170" fill="#8b949e" text-anchor="middle">el programa</text>

    <!-- flechas -->
    <line x1="200" y1="155" x2="248" y2="155" stroke="#79c0ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="420" y1="155" x2="468" y2="155" stroke="#79c0ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="640" y1="155" x2="688" y2="155" stroke="#79c0ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- TERM de fuera -->
    <rect x="30" y="30" width="610" height="56" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="45" y="54" fill="#79c0ff" font-size="15">TERM de fuera</text>
    <text x="45" y="76" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">TERM=xterm-256color, en tmux #{client_termname}</text>

    <!-- TERM de dentro -->
    <rect x="690" y="30" width="180" height="56" rx="6" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="705" y="54" fill="#3fb950" font-size="15">TERM de dentro</text>
    <text x="705" y="76" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">tmux-256color</text>

    <!-- dónde actúan las opciones -->
    <line x1="555" y1="200" x2="555" y2="250" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="780" y1="200" x2="780" y2="250" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="250" y="250" width="390" height="120" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="265" y="276" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">terminal-features 'xterm*:RGB:usstyle'</text>
    <text x="265" y="298" fill="#8b949e">Completa lo que terminfo no dice del TERM de fuera</text>
    <text x="265" y="320" fill="#8b949e">Se lee al conectarse: reconecta tras cambiarla</text>
    <text x="265" y="346" fill="#e3b341">Sin RGB: #3fb950 sale como 38;5;71 (256 colores)</text>

    <rect x="660" y="250" width="210" height="120" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="675" y="276" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">default-terminal</text>
    <text x="675" y="298" fill="#8b949e">Solo paneles nuevos</text>
    <text x="675" y="324" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">xterm-256color</text>
    <text x="675" y="346" fill="#f85149">aquí es mentir</text>
  </g>
</svg>
