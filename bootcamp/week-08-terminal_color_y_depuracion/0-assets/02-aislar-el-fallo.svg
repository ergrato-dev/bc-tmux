<svg viewBox="0 0 860 380" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Diagnóstico: un servidor nuevo sin config separa un fallo de la terminal de uno de tu config</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#79c0ff"/>
    </marker>
  </defs>
  <rect width="860" height="380" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <rect x="30" y="150" width="190" height="70" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="125" y="180" fill="#f0f6fc" text-anchor="middle" font-size="16">Algo se ve mal</text>
    <text x="125" y="202" fill="#8b949e" text-anchor="middle">color, tecla, estilo</text>

    <rect x="280" y="140" width="250" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="405" y="170" fill="#f0f6fc" text-anchor="middle">Servidor nuevo, sin config</text>
    <text x="405" y="195" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">tmux -L limpio -f /dev/null</text>
    <text x="405" y="216" fill="#8b949e" text-anchor="middle">¿sigue el fallo?</text>

    <line x1="220" y1="185" x2="278" y2="185" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M530,165 L570,165 L570,85 L598,85" fill="none" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M530,205 L570,205 L570,285 L598,285" fill="none" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="580" y="120" fill="#f85149">sí</text>
    <text x="580" y="260" fill="#3fb950">no</text>

    <rect x="600" y="30" width="230" height="110" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="615" y="56" fill="#f0f6fc" font-size="15">Terminal o terminfo</text>
    <text x="615" y="80" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">show-messages -T</text>
    <text x="615" y="102" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">#{client_termfeatures}</text>
    <text x="615" y="124" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">infocmp -x "$TERM"</text>

    <rect x="600" y="230" width="230" height="110" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="615" y="256" fill="#f0f6fc" font-size="15">Tu config</text>
    <text x="615" y="280" fill="#8b949e">carga conf.d/ de uno en uno</text>
    <text x="615" y="302" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">show-messages</text>
    <text x="615" y="324" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">tmux -vvv</text>

    <text x="30" y="330" fill="#e3b341">Recargar no basta: -L nuevo, -f /dev/null</text>
    <text x="30" y="352" fill="#8b949e">y vuelve a conectarte para leer las features</text>
  </g>
</svg>
