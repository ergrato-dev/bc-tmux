<svg viewBox="0 0 900 580" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Secuencia de wait-for entre un script, el servidor tmux y la shell de un panel</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="900" height="580" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- Cabeceras -->
    <rect x="70" y="30" width="160" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="150" y="61" fill="#f0f6fc" text-anchor="middle">Script</text>
    <rect x="370" y="30" width="160" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="450" y="61" fill="#f0f6fc" text-anchor="middle">Servidor tmux</text>
    <rect x="670" y="30" width="160" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="750" y="54" fill="#f0f6fc" text-anchor="middle">Shell del panel</text>
    <text x="750" y="71" fill="#8b949e" text-anchor="middle" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">%1</text>

    <!-- Líneas de vida -->
    <line x1="150" y1="80" x2="150" y2="500" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="450" y1="80" x2="450" y2="500" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="750" y1="80" x2="750" y2="500" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Script bloqueado -->
    <rect x="143" y="230" width="14" height="170" fill="#58a6ff" opacity="0.35"/>
    <text x="134" y="310" fill="#79c0ff" text-anchor="end">bloqueado,</text>
    <text x="134" y="328" fill="#79c0ff" text-anchor="end">sin sleep</text>

    <!-- Panel ocupado -->
    <rect x="743" y="190" width="14" height="180" fill="#3fb950" opacity="0.35"/>
    <text x="734" y="246" fill="#f0f6fc" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">make</text>
    <text x="734" y="266" fill="#8b949e" text-anchor="end">corre en la shell,</text>
    <text x="734" y="284" fill="#8b949e" text-anchor="end">sale con 2</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <!-- 1. teclear -->
      <text x="300" y="112" fill="#f0f6fc" text-anchor="middle">send-keys -t %1 -l -- "$line"</text>
      <line x1="150" y1="120" x2="446" y2="120" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="300" y="147" fill="#f0f6fc" text-anchor="middle">send-keys -t %1 Enter</text>
      <line x1="150" y1="155" x2="446" y2="155" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 3. esperar -->
      <text x="300" y="222" fill="#f0f6fc" text-anchor="middle">timeout 30 tmux wait-for hecho</text>
      <line x1="157" y1="230" x2="446" y2="230" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 4. el panel avisa -->
      <text x="600" y="327" fill="#f0f6fc" text-anchor="middle">tmux set -p @rc $?</text>
      <line x1="743" y1="335" x2="454" y2="335" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
      <text x="600" y="362" fill="#f0f6fc" text-anchor="middle">tmux wait-for -S hecho</text>
      <line x1="743" y1="370" x2="454" y2="370" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- 6. leer el código -->
      <text x="300" y="447" fill="#f0f6fc" text-anchor="middle">display -p -t %1 '#{@rc}'</text>
      <line x1="150" y1="455" x2="446" y2="455" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <!-- 2. el servidor teclea -->
    <text x="600" y="182" fill="#8b949e" text-anchor="middle">teclea la línea y Enter</text>
    <line x1="450" y1="190" x2="739" y2="190" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 5. despierta -->
    <text x="300" y="392" fill="#8b949e" text-anchor="middle">despierta: wait-for sale con 0</text>
    <line x1="450" y1="400" x2="161" y2="400" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- 7. respuesta -->
    <text x="300" y="482" fill="#8b949e" text-anchor="middle">2, el código de make</text>
    <line x1="450" y1="490" x2="154" y2="490" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Aviso -->
    <rect x="70" y="515" width="760" height="48" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="450" y="535" fill="#e3b341" text-anchor="middle">Si -S llega antes que wait-for, la señal queda guardada: no hay carrera.</text>
    <text x="450" y="553" fill="#e3b341" text-anchor="middle">Si nunca llega, timeout corta la espera y sale con 124.</text>
  </g>
</svg>
