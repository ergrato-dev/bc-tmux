# 40-terminal.conf — cómo habla tmux con tu terminal (semana 08).
#
# Hay dos TERM. El de fuera lo pone tu terminal y tmux lo lee al conectarte
# (#{client_termname}). El de dentro lo pone tmux para los programas de los
# paneles (default-terminal). Compruébalo todo con: bin/kit-doctor

# --- TERM de dentro ----------------------------------------------------------

# tmux-256color describe lo que tmux sabe hacer: cursiva, 256 colores, las
# teclas que entiende. Con xterm-256color, los programas creen hablar con un
# xterm y mandan secuencias que tmux no traduce igual (cursiva como vídeo
# inverso, teclas de función raras). Ya es el valor por defecto de 3.4, pero
# una distro o un local.conf viejo pueden cambiarlo: aquí se deja explícito.
# Si un programa dice "unknown terminal": falta su terminfo (docs/diagnostico.md).
set -s default-terminal tmux-256color

# --- Lo que sabe hacer la terminal de fuera ----------------------------------

# terminal-features asocia un patrón del TERM de fuera con lo que esa terminal
# soporta. 3.4 ya trae "xterm*:clipboard:ccolour:cstyle:focus:title"; el kit
# añade lo que tmux no puede adivinar:
#   RGB      color de 24 bits: sin él, los "#3fb950" se aproximan a 256 colores
#   usstyle  subrayado ondulado y de color (undercurl de Neovim)
#   extkeys  teclas extendidas (C-Enter, S-Enter), ver extended-keys abajo
# xterm* cubre casi todas: Windows Terminal, GNOME Terminal, iTerm2, WezTerm y
# kitty (xterm-kitty) anuncian TERM=xterm-256color o parecido. Para otra
# terminal (alacritty, foot), añade su línea en local.conf. Terminal.app de
# macOS dice xterm-256color y no tiene color de 24 bits: en esa máquina,
# local.conf con "set -su terminal-features".
#
# Es una lista: -a añade una entrada en cada recarga. -u la devuelve al valor
# por defecto antes de añadir, así recargar deja siempre las mismas entradas.
# Las features se leen al conectarse un cliente: tras cambiarlas, desconecta
# y vuelve a conectar (prefix d, tmux attach).
set -su terminal-features
set -sa terminal-features "xterm*:RGB:usstyle:extkeys"

# --- Teclas y foco -----------------------------------------------------------

# on: tmux entiende las teclas extendidas de la terminal y se las pasa a los
# programas que las piden (Neovim sí, bash no). always las manda a todos, y un
# programa que no las espera recibe basura en lugar de C-Enter.
set -s extended-keys on

# La terminal avisa cuando ganas o pierdes el foco y tmux se lo pasa al panel:
# Neovim relee con autoread los archivos que cambiaste fuera.
set -s focus-events on

# --- Passthrough -------------------------------------------------------------

# Un programa puede envolver una secuencia en \ePtmux;...\e\\ para que tmux la
# mande tal cual a la terminal de fuera: imágenes en la terminal, avisos de
# escritorio. Riesgo: lo que pasa no lo filtra tmux, así que un programa del
# panel puede, por ejemplo, escribir en tu portapapeles saltándose
# set-clipboard. on solo deja pasar al panel visible; all también a paneles y
# ventanas que no estás viendo, donde no ves lo que hacen. Por defecto, off.
setw -g allow-passthrough on
