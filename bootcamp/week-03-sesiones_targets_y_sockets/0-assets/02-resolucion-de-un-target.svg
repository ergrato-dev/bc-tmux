<svg viewBox="0 0 900 470" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Flujo de resolución de -t api: id, nombre exacto, prefijo único y patrón; con =api solo se prueba el nombre exacto</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <rect x="330" y="16" width="240" height="40" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="450" y="41" fill="#f78166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">-t api   /   -t =api</text>

    <!-- step 1 -->
    <line x1="450" y1="56" x2="450" y2="78" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="82" width="300" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="450" y="109" fill="#f0f6fc" text-anchor="middle">1. ¿Es un id? ($0, $1...)</text>
    <line x1="600" y1="104" x2="676" y2="104" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="638" y="96" fill="#8b949e" text-anchor="middle" font-size="12">sí</text>
    <rect x="680" y="84" width="190" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="775" y="109" fill="#3fb950" text-anchor="middle">esa sesión</text>

    <!-- step 2 -->
    <line x1="450" y1="126" x2="450" y2="158" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="462" y="146" fill="#8b949e" font-size="12">no</text>
    <rect x="300" y="162" width="300" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="450" y="189" fill="#f0f6fc" text-anchor="middle">2. ¿Hay una sesión llamada api?</text>
    <line x1="600" y1="184" x2="676" y2="184" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="638" y="176" fill="#8b949e" text-anchor="middle" font-size="12">sí</text>
    <rect x="680" y="164" width="190" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="775" y="189" fill="#3fb950" text-anchor="middle">api</text>

    <!-- step 3 -->
    <line x1="450" y1="206" x2="450" y2="238" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="462" y="226" fill="#8b949e" font-size="12">no</text>
    <rect x="300" y="242" width="300" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="450" y="269" fill="#f0f6fc" text-anchor="middle">3. ¿El target empezaba por = ?</text>
    <line x1="300" y1="264" x2="224" y2="264" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="262" y="256" fill="#8b949e" text-anchor="middle" font-size="12">sí</text>
    <rect x="30" y="244" width="190" height="40" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="125" y="269" fill="#f85149" text-anchor="middle">error: no existe</text>

    <!-- step 4 -->
    <line x1="450" y1="286" x2="450" y2="318" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="462" y="306" fill="#8b949e" font-size="12">no</text>
    <rect x="250" y="322" width="400" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="450" y="345" fill="#f0f6fc" text-anchor="middle">4. Candidatas: empiezan por api</text>
    <text x="450" y="366" fill="#f0f6fc" text-anchor="middle">o encajan con él como patrón (-t 'a*')</text>

    <line x1="330" y1="378" x2="160" y2="408" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="378" x2="450" y2="408" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="570" y1="378" x2="740" y2="408" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="60" y="412" width="200" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="160" y="439" fill="#f85149" text-anchor="middle">0: error</text>
    <rect x="335" y="412" width="230" height="44" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="450" y="432" fill="#e3b341" text-anchor="middle">1: la usa sin avisar</text>
    <text x="450" y="449" fill="#8b949e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">api-vieja</text>
    <rect x="640" y="412" width="200" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="740" y="439" fill="#f85149" text-anchor="middle">2 o más: error, ambigua</text>
  </g>
</svg>
