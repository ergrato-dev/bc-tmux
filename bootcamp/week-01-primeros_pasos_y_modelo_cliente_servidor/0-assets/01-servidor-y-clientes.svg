<svg viewBox="0 0 900 420" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Dos terminales conectadas como clientes a un servidor tmux a través de un socket; una tercera terminal cerrada no afecta al servidor ni a sus sesiones</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- Column labels -->
    <text x="120" y="36" fill="#8b949e" text-anchor="middle" font-size="13">CLIENTES (tus terminales)</text>
    <text x="400" y="36" fill="#8b949e" text-anchor="middle" font-size="13">SOCKET</text>
    <text x="700" y="36" fill="#8b949e" text-anchor="middle" font-size="13">SERVIDOR (segundo plano)</text>

    <!-- Client A -->
    <rect x="30" y="60" width="180" height="70" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="120" y="88" fill="#f0f6fc" text-anchor="middle">Terminal del portátil</text>
    <text x="120" y="112" fill="#8b949e" text-anchor="middle" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tmux attach -t api</text>

    <!-- Client B -->
    <rect x="30" y="165" width="180" height="70" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="120" y="193" fill="#f0f6fc" text-anchor="middle">SSH desde otra máquina</text>
    <text x="120" y="217" fill="#8b949e" text-anchor="middle" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tmux attach -t api</text>

    <!-- Client C (closed) -->
    <rect x="30" y="270" width="180" height="70" rx="6" fill="#161b22" stroke="#f85149"
          stroke-width="2" stroke-dasharray="6 4"/>
    <text x="120" y="298" fill="#f85149" text-anchor="middle">Terminal cerrada</text>
    <text x="120" y="322" fill="#8b949e" text-anchor="middle" font-size="12">su cliente murió</text>

    <!-- Socket -->
    <rect x="310" y="150" width="180" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="400" y="185" fill="#f0f6fc" text-anchor="middle" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/tmp/tmux-1000/</text>
    <text x="400" y="205" fill="#f0f6fc" text-anchor="middle" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">default</text>
    <text x="400" y="232" fill="#8b949e" text-anchor="middle" font-size="12">permisos 0700: solo tú</text>

    <!-- Arrows clients -> socket -->
    <line x1="210" y1="95" x2="306" y2="180" stroke="#58a6ff" stroke-width="2"
          marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="210" y1="200" x2="306" y2="200" stroke="#58a6ff" stroke-width="2"
          marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="210" y1="305" x2="306" y2="225" stroke="#f85149" stroke-width="2"
          stroke-dasharray="6 4"/>
    <text x="238" y="300" fill="#f85149" font-size="13">✕</text>

    <!-- Arrow socket -> server -->
    <line x1="490" y1="200" x2="556" y2="200" stroke="#58a6ff" stroke-width="2"
          marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- Server -->
    <rect x="560" y="60" width="300" height="290" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="710" y="88" fill="#3fb950" text-anchor="middle" font-weight="700">tmux server</text>
    <text x="710" y="108" fill="#8b949e" text-anchor="middle" font-size="12">padre de todos los programas</text>

    <rect x="580" y="125" width="260" height="110" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="596" y="148" fill="#f0f6fc">sesión api</text>
    <text x="824" y="148" fill="#58a6ff" text-anchor="end" font-size="12">2 clientes</text>
    <text x="596" y="176" fill="#8b949e" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">nvim main.go</text>
    <text x="596" y="198" fill="#8b949e" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">go test ./... (40 min)</text>
    <text x="596" y="220" fill="#8b949e" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tail -f app.log</text>

    <rect x="580" y="250" width="260" height="80" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="596" y="273" fill="#f0f6fc">sesión notas</text>
    <text x="824" y="273" fill="#8b949e" text-anchor="end" font-size="12">0 clientes</text>
    <text x="596" y="301" fill="#8b949e" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">vim pendientes.md</text>
    <text x="596" y="320" fill="#3fb950" font-size="12">sigue viva sin nadie mirando</text>

    <!-- Footer -->
    <text x="450" y="390" fill="#e3b341" text-anchor="middle">
      Cerrar una terminal mata su cliente, no el servidor: las sesiones y sus programas siguen.
    </text>
  </g>
</svg>
