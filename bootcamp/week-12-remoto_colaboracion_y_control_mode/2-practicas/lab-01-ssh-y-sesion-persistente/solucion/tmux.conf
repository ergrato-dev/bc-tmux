# lab-01 — SSH y sesión persistente: la status line dice dónde estás y si el
# servidor arrancó desde una sesión SSH.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s trabajo

set -g status-left-length 30

# Por SSH todas las terminales se parecen: el host en la barra evita escribir
# en la máquina equivocada.
set -g status-left "[#{host_short}] "

# Un format no lee variables de entorno; if-shell sí, al cargar la config y
# con el entorno con el que arrancó el servidor. SSH_CONNECTION solo existe
# si el servidor nació dentro de una sesión SSH.
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g @lab-remote on
  set -g status-style "bg=#58a6ff,fg=#0d1117"
} {
  set -g @lab-remote off
}
