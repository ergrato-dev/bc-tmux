# lab-04 — Socket compartido: la config del servidor que comparte share.sh.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   ./solucion/share.sh invitado

set -g status-style "bg=#3fb950,fg=#0d1117"

# La barra se pinta para cada cliente: client_readonly es el de quien mira.
# Así el invitado sabe que sus teclas no llegan.
set -g status-right "#{?client_readonly,#[bg=#f85149] SOLO LECTURA #[default] ,}#{session_attached} clientes"
