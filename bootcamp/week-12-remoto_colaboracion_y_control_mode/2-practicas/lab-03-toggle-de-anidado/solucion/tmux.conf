# lab-03 — Toggle de anidado: F12 apaga este tmux para que el de dentro
# reciba todas las teclas, y F12 lo vuelve a encender.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L fuera -f "$PWD/solucion/tmux.conf" new -d -s fuera

set -g status-position top
set -g status-style "bg=#3fb950,fg=#0d1117"
set -g status-left "[fuera] "

# Sin prefix y en una tabla que solo tiene F12: todo lo demás pasa al panel.
# set sin -g cambia la sesión, no el global: las otras sesiones siguen igual.
bind -n F12 set prefix None \; set key-table off

# set -u borra el valor de la sesión y vuelve a heredar el global, sea cual
# sea: el toggle no necesita saber qué prefix había. Sin este binding en la
# tabla off, F12 ya no vuelve.
bind -T off F12 set -u prefix \; set -u key-table

# key-table es una opción de sesión: un format la lee sin cliente. Sin el
# aviso, un tmux apagado parece roto.
set -g status-right "#{?#{==:#{key-table},off},#[bg=#e3b341] OFF #[default] ,}%H:%M"
