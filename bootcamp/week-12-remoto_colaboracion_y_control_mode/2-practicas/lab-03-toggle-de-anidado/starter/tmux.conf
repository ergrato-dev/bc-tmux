# lab-03 — Toggle de anidado: F12 apaga este tmux para que el de dentro
# reciba todas las teclas, y F12 lo vuelve a encender.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L fuera -f "$PWD/starter/tmux.conf" new -d -s fuera
# Recargar tras editar:
#   tmux -L fuera source-file "$PWD/starter/tmux.conf"

set -g status-position top
set -g status-style "bg=#3fb950,fg=#0d1117"
set -g status-left "[fuera] "

# TODO 1: F12 sin prefix (bind -n) apaga este tmux en la sesión actual: dos
# set SIN -g separados por \; :
#   prefix a None   y   key-table a off

# TODO 2: en la tabla off (bind -T off) F12 lo enciende otra vez. Usa set -u
# (sin valor) sobre prefix y sobre key-table para volver a heredar el global.

# TODO 3: aviso en la barra. status-right empieza con " OFF " sobre fondo
# amarillo cuando la tabla es off, y termina con la hora:
#   #{?#{==:#{key-table},off},#[bg=#e3b341] OFF #[default] ,}%H:%M
set -g status-right "%H:%M"
