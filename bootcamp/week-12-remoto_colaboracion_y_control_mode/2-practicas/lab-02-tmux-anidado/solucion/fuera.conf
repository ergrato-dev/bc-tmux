# lab-02 — tmux anidado: el tmux de FUERA (tu portátil).
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L fuera -f "$PWD/solucion/fuera.conf" new -d -s fuera

# Con dos barras en pantalla, la de fuera arriba y en verde: así sabes de un
# vistazo a qué tmux le estás hablando.
set -g status-position top
set -g status-style "bg=#3fb950,fg=#0d1117"
set -g status-left "[fuera] "
