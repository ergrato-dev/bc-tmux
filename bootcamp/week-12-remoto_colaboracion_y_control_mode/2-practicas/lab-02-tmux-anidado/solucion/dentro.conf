# lab-02 — tmux anidado: el tmux de DENTRO (el servidor al que entras por SSH).
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L dentro -f "$PWD/solucion/dentro.conf" new -d -s dentro

set -g status-style "bg=#58a6ff,fg=#0d1117"
set -g status-left "[dentro] "

# Otro prefix para el de dentro: C-a llega sin tocar porque el de fuera no lo
# usa. Sin esto, cada orden al de dentro cuesta C-b C-b.
set -g prefix C-a
unbind C-b
bind C-a send-prefix
