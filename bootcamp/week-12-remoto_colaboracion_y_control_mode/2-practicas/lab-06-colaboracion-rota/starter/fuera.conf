# lab-06 — El tmux de FUERA de un compañero, roto a propósito: arranca sin
# errores, pero el anidado no funciona como promete.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L fuera -f "$PWD/starter/fuera.conf" new -d -s fuera
# Recargar tras editar:
#   tmux -L fuera source-file "$PWD/starter/fuera.conf"

# Colores de verdad en todas partes.
set -g default-terminal xterm-256color

set -g status-position top
set -g status-style "bg=#3fb950,fg=#0d1117"
set -g status-left "[fuera] "
set -g status-right "#{?#{==:#{key-table},off},#[bg=#e3b341] OFF #[default] ,}%H:%M"

# Volver a la ventana anterior con la tecla más cómoda.
bind C-b last-window

# F12 apaga este tmux para el de dentro y F12 lo enciende.
bind -n F12 set prefix None \; set key-table off
bind F12 set -u prefix \; set -u key-table
