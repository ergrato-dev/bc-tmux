# lab-06 — El tmux de FUERA, arreglado.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L fuera -f "$PWD/solucion/fuera.conf" new -d -s fuera

# Fallo 5: dentro de tmux la terminal es tmux, no xterm. Con xterm-256color
# los programas del panel, y el tmux de dentro, piden cosas de xterm.
set -g default-terminal tmux-256color

set -g status-position top
set -g status-style "bg=#3fb950,fg=#0d1117"
set -g status-left "[fuera] "
set -g status-right "#{?#{==:#{key-table},off},#[bg=#e3b341] OFF #[default] ,}%H:%M"

# Fallo 4: C-b C-b es el send-prefix por defecto, el que hace llegar el prefix
# al tmux de dentro. last-window se va a otra tecla.
bind C-b send-prefix
bind Tab last-window

# Fallo 3: el binding de vuelta va en la tabla off, la única que mira la
# sesión apagada. Sin -T off acaba en la tabla prefix, inalcanzable.
bind -n F12 set prefix None \; set key-table off
bind -T off F12 set -u prefix \; set -u key-table
