<svg viewBox="0 0 900 450" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Las dos puertas de un socket compartido: el sistema de archivos (directorio 710 y socket 660 del grupo pair) frena a nobody con Permission denied; la lista server-access frena a ana, del grupo pair pero fuera de la lista, con access not allowed y código 0; invitado, en la lista con (R), llega al servidor en solo lectura</title>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- Puerta 1 -->
    <rect x="250" y="30" width="220" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="268" y="56" fill="#f0f6fc">1. Sistema de archivos</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <text x="268" y="84" fill="#d2a8ff">dir  710 alumno:pair</text>
      <text x="268" y="108" fill="#d2a8ff">pair 660 alumno:pair</text>
    </g>
    <line x1="360" y1="130" x2="360" y2="430" stroke="#30363d" stroke-width="4"/>

    <!-- Puerta 2 -->
    <rect x="500" y="30" width="190" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="518" y="56" fill="#f0f6fc">2. server-access -l</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <text x="518" y="84" fill="#d2a8ff">alumno (W)</text>
      <text x="518" y="108" fill="#d2a8ff">invitado (R)</text>
    </g>
    <line x1="595" y1="130" x2="595" y2="430" stroke="#30363d" stroke-width="4"/>

    <!-- Servidor -->
    <rect x="710" y="30" width="170" height="400" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="795" y="58" fill="#f0f6fc" text-anchor="middle">Servidor</text>
    <text x="795" y="78" fill="#f0f6fc" text-anchor="middle">de alumno</text>
    <text x="795" y="104" fill="#3fb950" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">sesión pair</text>

    <!-- nobody -->
    <rect x="30" y="165" width="160" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="110" y="187" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">nobody</text>
    <text x="110" y="205" fill="#8b949e" text-anchor="middle" font-size="12">fuera del grupo</text>
    <line x1="190" y1="190" x2="354" y2="190" stroke="#f85149" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="200" y="230" fill="#f85149" font-size="12">Permission denied</text>
    <text x="200" y="248" fill="#f85149" font-size="12">rc 1</text>

    <!-- ana -->
    <rect x="30" y="265" width="160" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="110" y="287" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ana</text>
    <text x="110" y="305" fill="#8b949e" text-anchor="middle" font-size="12">grupo pair, sin lista</text>
    <line x1="190" y1="290" x2="589" y2="290" stroke="#e3b341" stroke-width="2" marker-end="url(#arrow-yellow)"/>
    <text x="380" y="330" fill="#e3b341" font-size="12">access not allowed</text>
    <text x="380" y="348" fill="#e3b341" font-size="12">rc 0: míralo por el texto</text>

    <!-- invitado -->
    <rect x="30" y="365" width="160" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="110" y="387" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">invitado</text>
    <text x="110" y="405" fill="#8b949e" text-anchor="middle" font-size="12">grupo pair, (R)</text>
    <line x1="190" y1="390" x2="706" y2="390" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="610" y="378" fill="#79c0ff" font-size="12">solo lectura</text>
    <text x="795" y="324" fill="#f0f6fc" text-anchor="middle" font-size="12">ve la sesión;</text>
    <text x="795" y="344" fill="#f0f6fc" text-anchor="middle" font-size="12">al escribir:</text>
    <text x="795" y="366" fill="#f85149" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">client is read-only</text>
  </g>
</svg>
