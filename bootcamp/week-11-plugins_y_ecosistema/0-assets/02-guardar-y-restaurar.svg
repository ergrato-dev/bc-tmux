<svg viewBox="0 0 900 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Guardar y restaurar con resurrect y continuum: continuum llama a save.sh desde la status line de un cliente conectado, resurrect escribe un archivo de texto que sobrevive al kill-server, y al arrancar el servidor siguiente con @continuum-restore on, restore.sh recrea sesiones, ventanas y directorios</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d2a8ff"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- Fila de guardado -->
    <rect x="30" y="40" width="260" height="120" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="50" y="68" fill="#f0f6fc">Servidor 1, con un cliente</text>
    <text x="50" y="94" fill="#8b949e">status-right empieza por</text>
    <text x="50" y="118" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">#(.../continuum_save.sh)</text>
    <text x="50" y="144" fill="#8b949e">cada @continuum-save-interval</text>

    <rect x="340" y="40" width="220" height="120" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="450" y="74" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">save.sh</text>
    <text x="450" y="100" fill="#8b949e" text-anchor="middle">de resurrect</text>
    <text x="450" y="132" fill="#8b949e" text-anchor="middle">o a mano: prefix C-s</text>
    <line x1="290" y1="100" x2="336" y2="100" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="610" y="40" width="260" height="120" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="630" y="68" fill="#f0f6fc">Archivo de texto</text>
    <text x="630" y="94" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">@resurrect-dir/last</text>
    <text x="630" y="120" fill="#8b949e">sesiones, ventanas, paneles,</text>
    <text x="630" y="142" fill="#8b949e">directorios y layouts</text>
    <line x1="560" y1="100" x2="606" y2="100" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Corte -->
    <line x1="30" y1="215" x2="870" y2="215" stroke="#f85149" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="30" y="205" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">kill-server · reinicio de la máquina</text>
    <text x="725" y="205" fill="#8b949e" text-anchor="end">el archivo sobrevive</text>

    <!-- Fila de restauración -->
    <rect x="30" y="260" width="260" height="120" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="50" y="288" fill="#f0f6fc">Servidor 2 arranca</text>
    <text x="50" y="314" fill="#8b949e">0 sesiones al leer la config</text>
    <text x="50" y="340" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">@continuum-restore on</text>

    <rect x="340" y="260" width="220" height="120" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="450" y="294" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">restore.sh</text>
    <text x="450" y="320" fill="#8b949e" text-anchor="middle">de resurrect</text>
    <text x="450" y="352" fill="#8b949e" text-anchor="middle">o a mano: prefix C-r</text>
    <line x1="290" y1="320" x2="336" y2="320" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M740,160 L740,236 L470,236 L470,256" fill="none" stroke="#d2a8ff" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <rect x="610" y="260" width="260" height="120" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="630" y="288" fill="#f0f6fc">Vuelven</text>
    <text x="630" y="314" fill="#8b949e">ventanas, nombres y rutas</text>
    <text x="630" y="338" fill="#8b949e">top, less, vim... si eran hijos</text>
    <text x="630" y="360" fill="#8b949e">de la shell del panel</text>
    <line x1="560" y1="320" x2="606" y2="320" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Avisos -->
    <rect x="30" y="410" width="840" height="70" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="50" y="438" fill="#e3b341">Sin cliente conectado o sin barra, el #(...) no corre y continuum no guarda nada.</text>
    <text x="50" y="462" fill="#e3b341">No vuelven los procesos en marcha: un programa fuera de la lista vuelve como shell.</text>
  </g>
</svg>
