# 20-bindings.conf — prefix y teclas del kit.
# Todas las teclas del kit llevan -N "kit: ...": la nota sale en prefix ? y
# en bin/kit-keys, y distingue lo tuyo de las teclas por defecto de tmux.

# --- Prefix ------------------------------------------------------------------

# C-a: se pulsa sin mover la mano (Caps Lock como Ctrl) y lo conoce cualquiera
# que haya usado screen. El precio: C-a es "inicio de línea" en bash, así que
# para eso hay que pulsarlo dos veces (send-prefix).
set -g prefix C-a
# Sin unbind, C-b seguiría haciendo send-prefix desde la config por defecto.
unbind C-b
bind -N "kit: envía C-a al programa del panel" C-a send-prefix

# --- Recarga -----------------------------------------------------------------

# -F expande @kit-dir al pulsar la tecla: recarga este kit esté donde esté.
# Recargar no deshace lo que borres de la config: eso necesita set -u o
# reiniciar el servidor.
bind -N "kit: recarga la config" r source-file -F "#{@kit-dir}/tmux.conf" \; display "config recargada"

# --- Splits ------------------------------------------------------------------

# El panel nuevo abre en el directorio del actual, no en el de la sesión.
# | y - se parecen a la línea que dibujan. Pisan prefix - (delete-buffer):
# los buffers se borran desde prefix = (choose-buffer, tecla d).
bind -N "kit: divide a la derecha en el mismo directorio" | split-window -h -c "#{pane_current_path}"
bind -N "kit: divide debajo en el mismo directorio"       - split-window -v -c "#{pane_current_path}"

# --- Modo resize -------------------------------------------------------------

# prefix R mete al cliente en la tabla kit-resize. tmux devuelve el cliente a
# root antes de ejecutar cada tecla de una tabla propia: cada una vuelve a
# entrar con switch-client, así el modo dura hasta q, Escape o Enter, sin
# depender de repeat-time. Las teclas que no están en la tabla salen del modo
# y no hacen nada.
bind -N "kit: entra en el modo resize" R switch-client -T kit-resize

bind -T kit-resize -N "kit: borde a la izquierda (5)"  h      resize-pane -L 5 \; switch-client -T kit-resize
bind -T kit-resize -N "kit: borde abajo (5)"           j      resize-pane -D 5 \; switch-client -T kit-resize
bind -T kit-resize -N "kit: borde arriba (5)"          k      resize-pane -U 5 \; switch-client -T kit-resize
bind -T kit-resize -N "kit: borde a la derecha (5)"    l      resize-pane -R 5 \; switch-client -T kit-resize
bind -T kit-resize -N "kit: borde a la izquierda (1)"  H      resize-pane -L 1 \; switch-client -T kit-resize
bind -T kit-resize -N "kit: borde abajo (1)"           J      resize-pane -D 1 \; switch-client -T kit-resize
bind -T kit-resize -N "kit: borde arriba (1)"          K      resize-pane -U 1 \; switch-client -T kit-resize
bind -T kit-resize -N "kit: borde a la derecha (1)"    L      resize-pane -R 1 \; switch-client -T kit-resize
bind -T kit-resize -N "kit: sale del modo resize"      q      switch-client -T root
bind -T kit-resize -N "kit: sale del modo resize"      Escape switch-client -T root
bind -T kit-resize -N "kit: sale del modo resize"      Enter  switch-client -T root

# --- Navegación entre paneles sin prefix -------------------------------------

# C-h/j/k/l en root: sin prefix, así que se roban a todos los programas.
# alternate_on es 1 cuando el panel muestra un programa a pantalla completa
# (less, watch, un editor): entonces la tecla le llega a él. pane_current_command
# no sirve: con "seq 100 | less" dice bash. Con @kit-nav off (10-options.conf)
# las cuatro teclas pasan siempre al programa.
bind -n -N "kit: panel de la izquierda" C-h if -F '#{||:#{alternate_on},#{!=:#{@kit-nav},on}}' 'send-keys C-h' 'select-pane -L'
bind -n -N "kit: panel de abajo"        C-j if -F '#{||:#{alternate_on},#{!=:#{@kit-nav},on}}' 'send-keys C-j' 'select-pane -D'
bind -n -N "kit: panel de arriba"       C-k if -F '#{||:#{alternate_on},#{!=:#{@kit-nav},on}}' 'send-keys C-k' 'select-pane -U'
bind -n -N "kit: panel de la derecha"   C-l if -F '#{||:#{alternate_on},#{!=:#{@kit-nav},on}}' 'send-keys C-l' 'select-pane -R'

# En la shell, C-l ya no limpia la pantalla: prefix C-l se lo envía.
bind -N "kit: envía C-l (limpia la pantalla)" C-l send-keys C-l

# --- Copy mode (semana 04) ---------------------------------------------------

bind -T copy-mode-vi -N "kit: empieza la selección"  v      send -X begin-selection
bind -T copy-mode-vi -N "kit: selección rectangular" C-v    send -X rectangle-toggle
bind -T copy-mode-vi -N "kit: copia al portapapeles" y      send -X copy-pipe-and-cancel
bind -T copy-mode-vi -N "kit: sale de copy mode"     Escape send -X cancel
