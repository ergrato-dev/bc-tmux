# lab-01 — TPM desde cero (solución).
#
# Probar sin tocar tu sesión (desde la carpeta del lab, con home/ preparado
# como dice el paso 0 del README):
#   env -u XDG_CONFIG_HOME HOME="$PWD/home" tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s lab

set -g base-index 1

# Para tmux, @plugin es una opción normal: cada línea pisa a la anterior.
# TPM no le pregunta al servidor, lee estas líneas del archivo con awk.
set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'

# resurrect lee esta opción al cargarse: después del run-shell llegaría tarde
# y la tecla de guardar seguiría siendo C-s.
set -g @resurrect-save 'S'

# Al final: TPM ejecuta cada plugin con las opciones que ya estén puestas.
run-shell '~/.config/tmux/plugins/tpm/tpm'
