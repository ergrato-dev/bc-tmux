# lab-06 — config modular de un compañero, ya arreglada (solución).
#
# Probar sin tocar tu sesión (desde la carpeta del lab, con home/ preparado
# como dice el paso 0 del README):
#   env -u XDG_CONFIG_HOME HOME="$PWD/home" tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s lab

# Carpeta de este archivo: conf.d/ y plugin/ cuelgan de ella.
set -gF @lab-dir "#{d:current_file}"

source-file -F "#{@lab-dir}/conf.d/*.conf"

# Al final (fallo 6): antes de conf.d, @tpm_plugins aún no existe al
# arrancar y TPM no carga nada; solo funcionaría a partir de la primera
# recarga. Fallo 3: entre comillas, la shell no expande la ~ y el test
# siempre falla; $HOME sí se expande entre comillas dobles.
if-shell 'test -x "$HOME/.config/tmux/plugins/tpm/tpm"' {
  run-shell '~/.config/tmux/plugins/tpm/tpm'
}
