# 60-plugins.conf — plugins de terceros (TPM) y el plugin propio.

# Fallo 4: TPM busca los set -g @plugin con awk en ~/.config/tmux/tmux.conf
# y en sus source-file de ruta literal; este archivo llega por un
# source-file -F con glob y TPM no lo lee. @tpm_plugins se lo pide al
# servidor, así que vale desde cualquier archivo.
# Fallo 5: siempre #tag; sin él, TPM clona la rama principal de hoy.
set -g @tpm_plugins '                 \
  tmux-plugins/tpm#v3.1.0             \
  tmux-plugins/tmux-resurrect#v4.0.0  \
'

set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# Plugin propio: cuántas sesiones hay, en status-right. Fallo 1: tiene que
# ser ejecutable (chmod +x); si no, run-shell sale con 126 sin decir nada.
run-shell "#{@lab-dir}/plugin/sessions.tmux"
