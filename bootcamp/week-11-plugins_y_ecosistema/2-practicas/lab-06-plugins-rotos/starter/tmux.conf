# lab-06 — config modular de un compañero, ROTA A PROPÓSITO.
#
# Carga sin errores al arrancar, pero los plugins no funcionan. No hay TODOs:
# el README da un síntoma por fallo y una pista.
#
# Probar sin tocar tu sesión (desde la carpeta del lab, con home/ preparado
# como dice el paso 0 del README):
#   env -u XDG_CONFIG_HOME HOME="$PWD/home" tmux -L lab -f "$PWD/starter/tmux.conf" new -d -s lab
# Recargar tras editar:
#   tmux -L lab source-file "$PWD/starter/tmux.conf"

# Carpeta de este archivo: conf.d/ y plugin/ cuelgan de ella.
set -gF @lab-dir "#{d:current_file}"

# TPM, solo si está instalado (en una máquina nueva no lo está).
if-shell 'test -x "~/.config/tmux/plugins/tpm/tpm"' {
  run-shell '~/.config/tmux/plugins/tpm/tpm'
}

source-file -F "#{@lab-dir}/conf.d/*.conf"
