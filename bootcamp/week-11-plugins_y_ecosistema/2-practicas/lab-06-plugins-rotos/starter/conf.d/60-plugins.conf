# 60-plugins.conf — plugins de terceros (TPM) y el plugin propio.

set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# Plugin propio: cuántas sesiones hay, en status-right.
run-shell "#{@lab-dir}/plugin/sessions.tmux"
