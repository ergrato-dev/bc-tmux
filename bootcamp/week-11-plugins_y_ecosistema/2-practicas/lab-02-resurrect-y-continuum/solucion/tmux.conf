# lab-02 — resurrect y continuum cargados a mano, sin TPM (solución).
#
# Probar sin tocar tu sesión (desde la carpeta del lab, con home/ y los
# plugins preparados como dicen los pasos 0 y 1 del README):
#   env -u XDG_CONFIG_HOME HOME="$PWD/home" tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s lab

set -g base-index 1

# Sin esto resurrect guarda en ~/.tmux/resurrect, fuera de XDG. Entre
# comillas dobles tmux cambiaría la ~ al leer la config; así la cambia
# resurrect cada vez que guarda o restaura.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'

run-shell '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'

# continuum usa los scripts que resurrect deja en @resurrect-*-script-path:
# cargado antes que resurrect, no tiene qué ejecutar. Guarda desde un #(...)
# que antepone a status-right, así que sin barra o sin cliente no guarda.
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'
run-shell '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'
