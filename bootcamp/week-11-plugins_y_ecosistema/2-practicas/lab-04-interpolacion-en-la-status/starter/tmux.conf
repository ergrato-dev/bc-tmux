# lab-04 — status line con marcadores que sustituye el plugin sysload.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   env -u XDG_CONFIG_HOME HOME="$PWD/home" tmux -L lab -f "$PWD/starter/tmux.conf" new -d -s lab
# Recargar tras editar:
#   tmux -L lab source-file "$PWD/starter/tmux.conf"

set -g status-interval 5
# #{sysload_load} y #{sysload_cores} no son formats de tmux: sin el plugin
# salen vacíos. El plugin los cambia por algo que tmux sí sabe expandir.
set -g status-right 'carga #{sysload_load}/#{sysload_cores} | %H:%M'

# Después de status-right: el plugin solo sustituye lo que ya está puesto.
run-shell "#{d:current_file}/sysload/sysload.tmux"
