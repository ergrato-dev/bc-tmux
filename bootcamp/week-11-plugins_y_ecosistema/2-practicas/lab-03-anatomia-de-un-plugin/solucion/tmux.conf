# lab-03 — config mínima que carga el plugin zoom-flag sin TPM (solución).
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   env -u XDG_CONFIG_HOME HOME="$PWD/home" tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s lab

set -g status-right '%H:%M'

# Después de status-right: el plugin le añade su segmento delante. Sin -b,
# la carga de la config espera a que el plugin termine.
run-shell "#{d:current_file}/zoom-flag/zoom-flag.tmux"
