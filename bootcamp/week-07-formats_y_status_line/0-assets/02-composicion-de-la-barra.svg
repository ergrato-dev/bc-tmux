<svg viewBox="0 0 1000 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Composición de la barra: status-format[0] junta status-left, la lista de ventanas y status-right; cada ventana usa window-status-format, la actual window-status-current-format, separadas por window-status-separator; status-style pinta toda la barra</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- status-format[0] -->
    <text x="500" y="30" text-anchor="middle" fill="#d2a8ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">status-format[0]</text>
    <path d="M40,50 L40,40 L960,40 L960,50" fill="none" stroke="#d2a8ff" stroke-width="2"/>

    <!-- zonas -->
    <text x="130" y="76" text-anchor="middle" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">status-left</text>
    <text x="450" y="76" text-anchor="middle" fill="#f0f6fc">lista de ventanas</text>
    <text x="840" y="76" text-anchor="middle" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">status-right</text>

    <!-- barra -->
    <rect x="40" y="90" width="920" height="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="42" y="92" width="176" height="40" fill="#3fb950"/>
    <text x="130" y="118" text-anchor="middle" fill="#0d1117" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"> api </text>
    <rect x="250" y="96" width="130" height="32" rx="3" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="315" y="118" text-anchor="middle" fill="#f0f6fc" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0:editor ZOOM</text>
    <rect x="400" y="96" width="90" height="32" rx="3" fill="none" stroke="#30363d" stroke-width="2"/>
    <text x="445" y="118" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1:logs</text>
    <rect x="510" y="96" width="90" height="32" rx="3" fill="none" stroke="#30363d" stroke-width="2"/>
    <text x="555" y="118" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2:db</text>
    <text x="840" y="118" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">main  bc-tmux-lab  10:14</text>

    <!-- anotaciones -->
    <line x1="130" y1="134" x2="130" y2="196" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="130" y="216" text-anchor="middle" fill="#f0f6fc" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">status-left-length</text>
    <text x="130" y="236" text-anchor="middle" fill="#e3b341" font-size="12">corta aquí (10 de serie)</text>

    <line x1="315" y1="128" x2="315" y2="266" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="315" y="286" text-anchor="middle" fill="#f0f6fc" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">window-status-current-format</text>
    <text x="315" y="306" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">window-status-current-style</text>
    <text x="315" y="324" text-anchor="middle" fill="#8b949e" font-size="12">la ventana actual</text>

    <line x1="500" y1="128" x2="500" y2="186" stroke="#f78166" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="206" text-anchor="middle" fill="#f78166" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">window-status-separator</text>
    <text x="500" y="224" text-anchor="middle" fill="#8b949e" font-size="12">entre ventanas</text>

    <line x1="580" y1="128" x2="640" y2="266" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="660" y="286" text-anchor="middle" fill="#f0f6fc" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">window-status-format</text>
    <text x="660" y="306" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">window-status-style</text>
    <text x="660" y="324" text-anchor="middle" fill="#8b949e" font-size="12">las demás ventanas</text>

    <line x1="860" y1="134" x2="860" y2="196" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="860" y="216" text-anchor="middle" fill="#f0f6fc" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">status-right-length</text>
    <text x="860" y="236" text-anchor="middle" fill="#e3b341" font-size="12">corta aquí (40 de serie)</text>

    <!-- status-style -->
    <rect x="40" y="350" width="920" height="34" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="500" y="372" text-anchor="middle" fill="#8b949e" font-size="13">status-style pinta el fondo de toda la barra; #[default] vuelve al estilo de su zona</text>
  </g>
</svg>
