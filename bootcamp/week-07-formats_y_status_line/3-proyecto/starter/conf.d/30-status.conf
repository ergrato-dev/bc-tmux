# 30-status.conf — status line del kit, sin plugins: solo formats de tmux.
#
# Escribe todo con set -g (sin -F): así los #{...} se guardan tal cual y tmux
# los expande cada vez que dibuja la barra. Prueba cada format antes de
# guardarlo, con el servidor del kit arrancado:
#   tmux -L kit display -p '#{session_name}'
#   tmux -L kit display -p '#{E:status-left}'      (lab-01-formats-y-display)
# Y después de cada cambio: tmux -L kit source-file "$PWD/tmux.conf"

