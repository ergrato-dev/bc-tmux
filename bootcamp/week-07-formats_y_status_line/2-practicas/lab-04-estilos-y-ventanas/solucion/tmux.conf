# Lab 04 — Estilos y lista de ventanas (solución)
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s api

set -g @lab-bg     colour235
set -g @lab-fg     colour250
set -g @lab-accent colour71
set -g @lab-warn   colour179

# Los #{@lab-...} se expanden al dibujar: tmux set -g @lab-bg red cambia la
# barra sin recargar.
set -g status-style 'fg=#{@lab-fg},bg=#{@lab-bg}'

set -g window-status-style 'fg=colour245'
set -g window-status-current-style 'fg=#{@lab-bg},bg=#{@lab-accent},bold'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-separator ''

# Sin #[default], el verde seguiría hasta el final de status-left.
set -g status-left '#[fg=#{@lab-bg},bg=#{@lab-accent},bold] #S #[default] '
set -g status-right '#[fg=#{@lab-warn}]#{W:#{?window_zoomed_flag,Z#{window_index} ,}}#[default]%H:%M '

set -g message-style 'fg=#{@lab-bg},bg=#{@lab-warn}'
set -g pane-active-border-style 'fg=#{@lab-accent}'
