# Lab 05 — Comandos en la barra y varias líneas (solución)
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s api

set -gF @lab-dir '#{d:current_file}'
set -g status-right-length 60

# #() corre en segundo plano: la barra enseña la última salida y la renueva
# cada status-interval. Un comando lento muestra un valor viejo, no congela.
set -g status-right '#(#{q:@lab-dir}/bin/lab-git-branch #{q:pane_current_path}) %H:%M '
set -g status-interval 5

set -g status 2
set -g 'status-format[1]' '#[align=centre]#{P:#{?pane_active,#[reverse],} #{pane_index}:#{pane_current_command} #[default]}'
