# Lab 03 — Modificadores (solución)
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s api

set -g @lab-path '/home/alumno/src/api/main.go'

# El corte va en el format: si status-left-length fuera más corto, tmux
# cortaría el lado entero sin … y se perdería el corchete.
set -g status-left-length 30
set -g status-left '[#{=/8/…:session_name}] '

set -g window-status-format '#I:#{b:pane_current_path} '
set -g window-status-current-format '#I:#{b:pane_current_path}* '

set -g @lab-label '#{session_name}@#{host_short}'
# 40 = status-left-length (30) + lo que ocupa la derecha, a ojo.
# e| no resuelve nombres de opción: #{window_width}, no window_width.
set -g status-right '#{e|-|:#{window_width},40}c #{E:@lab-label} %H:%M '
