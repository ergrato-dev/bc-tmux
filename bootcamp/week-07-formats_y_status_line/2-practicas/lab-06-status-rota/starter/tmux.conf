# ============================================================
# Lab 06 — Status line rota (a propósito)
# Semana 07: Formats y status line
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/starter/tmux.conf" new -d -s api
# No cambia el prefix: es C-b.
#
# La barra de un compañero. Lo que quería:
#   izquierda: [sesión] y, con el prefix pulsado, PREFIX en rojo
#   ventanas:  la actual entre corchetes
#   derecha:   rama git del panel, "#hoy:" y la fecha y hora
# Tiene cinco errores. No hay TODOs: el README del lab te da los síntomas.
# ============================================================

set -g status-style 'fg=colour250,bg=colour235'

set -g status-left '[#{session_name}] #{?client_prefix,#[fg=colour235,bg=colour203,bold] PREFIX #[default],}'

set -g window-status-format ' #I:#W '
set -g window-status-curent-format '[#I:#W]'

set -g status-right-length 60
set -g status-right '#(git -C #{pane_current_path} symbolic-ref --short HEAD) #hoy: %d/%m %H:%M '
