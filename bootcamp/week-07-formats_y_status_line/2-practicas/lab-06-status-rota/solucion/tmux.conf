# Lab 06 — Status line rota (solución)
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s api

set -g status-style 'fg=colour250,bg=colour235'

# Error 2: las comas del estilo, dentro de una rama de #{?...}, se escriben #,
# Error 3: con el valor por defecto (10), "[api] PREFIX " se cortaba.
set -g status-left-length 30
set -g status-left '[#{session_name}] #{?client_prefix,#[fg=colour235#,bg=colour203#,bold] PREFIX #[default],}'

set -g window-status-format ' #I:#W '
# Error 1: curent -> current. Un nombre de opción mal escrito es un error al
# cargar, pero tmux sigue con las líneas siguientes.
set -g window-status-current-format '[#I:#W]'

set -g status-right-length 60
# Error 4: q: cita la ruta del panel para la shell (espacios, $, ;).
# Error 5: ## es un # literal; #h es el host corto.
set -g status-right '#(git -C #{q:pane_current_path} symbolic-ref --short HEAD) ##hoy: %d/%m %H:%M '
