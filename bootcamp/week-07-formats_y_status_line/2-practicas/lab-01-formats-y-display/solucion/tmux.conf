# Lab 01 — Formats y display -p (solución)
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s api

set -g @lab-owner ana

# Sin -F el format se guarda tal cual: E: lo expande cada vez que se usa, en
# la ventana y el panel de ese momento.
set -g @lab-where '#{session_name}:#{window_index}.#{pane_index}'

set -g status-right '#{@lab-owner} #{E:@lab-where} '
