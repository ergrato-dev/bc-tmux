# ============================================================
# Lab 02 — Condicionales y comparaciones
# Semana 07: Formats y status line
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/starter/tmux.conf" new -d -s api
# No cambia el prefix: es C-b.
# ============================================================

# Ya escrito: la derecha de la barra junta cinco indicadores. Cada uno es una
# opción de usuario que empieza vacía; E: la expande al dibujar.
set -g status-right-length 60
set -g status-right '#{E:@lab-prefix}#{E:@lab-zoom}#{E:@lab-env}#{E:@lab-panes}#{E:@lab-look}%H:%M '
set -g @lab-prefix ''
set -g @lab-zoom ''
set -g @lab-env ''
set -g @lab-panes ''
set -g @lab-look ''

