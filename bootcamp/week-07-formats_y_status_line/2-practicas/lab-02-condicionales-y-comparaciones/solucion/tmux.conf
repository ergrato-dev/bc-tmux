# Lab 02 — Condicionales y comparaciones (solución)
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s api

set -g status-right-length 60
set -g status-right '#{E:@lab-prefix}#{E:@lab-zoom}#{E:@lab-env}#{E:@lab-panes}#{E:@lab-look}%H:%M '

# client_prefix vale 1 en cualquier tabla que no sea root, no solo en prefix.
set -g @lab-prefix '#{?client_prefix,PREFIX ,}'
set -g @lab-zoom '#{?window_zoomed_flag,ZOOM ,}'
set -g @lab-env '#{?#{m:*-prod,#{session_name}},PROD ,}'
# #{<:} y #{>=:} comparan texto ("10" < "9"); e| compara números.
set -g @lab-panes '#{?#{e|>=|:#{window_panes},3},#{window_panes} paneles#, ventana #{window_index} ,}'
set -g @lab-look '#{?#{||:#{window_zoomed_flag},#{pane_synchronized}},OJO ,}'
