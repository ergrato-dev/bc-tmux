# ============================================================
# Lab 02 — Un prefix propio (SOLUCIÓN)
# ============================================================

# C-a: se pulsa sin mover la mano (con Caps Lock como Ctrl) y lo conoce
# cualquiera que haya usado screen. El precio: en bash, C-a es "inicio de
# línea"; para eso hay que pulsarlo dos veces.
set -g prefix C-a

# La config por defecto trae "bind C-b send-prefix": sin unbind, C-b seguiría
# ocupada.
unbind C-b

# prefix + C-a envía un C-a de verdad al programa del panel.
bind C-a send-prefix
