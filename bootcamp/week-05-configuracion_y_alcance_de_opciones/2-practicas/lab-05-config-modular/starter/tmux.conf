# ============================================================
# Lab 05 — Config modular
# Semana 05: Configuración y alcance de opciones
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/starter/tmux.conf"
#
# Hoy todo vive aquí. Al terminar, este archivo solo carga conf.d/.
# ============================================================

# TODO 1: guarda el directorio de este archivo en @lab-dir.
#         Pista: set -gF @lab-dir "#{d:current_file}"
# TODO 2: carga conf.d/*.conf y, si existe, local.conf (pasos 2, 3 y 6 del
#         README). Mueve las opciones a conf.d/10-options.conf y las teclas
#         a conf.d/20-bindings.conf.

set -s escape-time 10
set -sF copy-command "#{d:current_file}/bin/copy"

set -g base-index 1
set -g mouse on

setw -g mode-keys vi
setw -g pane-base-index 1

# Este lab usa C-a como prefix: es la tecla para salir (C-a d).
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
