# 10-opciones.conf — opciones, con su alcance explícito.

set -s escape-time 10
# Aquí current_file sería conf.d/10-opciones.conf: la ruta sale de @lab-dir.
set -sF copy-command "#{@lab-dir}/bin/copiar"

set -g base-index 1
set -g mouse on

setw -g mode-keys vi
setw -g pane-base-index 1

# Opciones que solo existen en versiones nuevas: se decide al leer el
# archivo, sin lanzar una shell.
%if "#{>=:#{version},3.5}"
set -g @lab-moderno on
%else
set -g @lab-moderno off
%endif
