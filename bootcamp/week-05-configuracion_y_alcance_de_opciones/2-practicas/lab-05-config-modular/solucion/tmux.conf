# ============================================================
# Lab 05 — Config modular (SOLUCIÓN)
# Solo el punto de entrada: las opciones y las teclas viven en conf.d/.
# ============================================================

# current_file solo existe mientras se lee este archivo: se guarda para los
# módulos y para la tecla de recarga.
set -gF @lab-dir "#{d:current_file}"

# Con -F, la ruta sale de @lab-dir y no del directorio desde el que arrancas
# tmux. El glob se ordena por nombre: 10- antes que 20-.
source-file -F "#{@lab-dir}/conf.d/*.conf"

# Lo propio de esta máquina, fuera de git. -q: si no existe, nada.
source-file -qF "#{@lab-dir}/local.conf"
