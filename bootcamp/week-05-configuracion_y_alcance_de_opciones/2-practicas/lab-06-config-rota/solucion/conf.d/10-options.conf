# Opciones del kit.
set -s escape-time 10
set -g base-index 1
set -g history-limit 50000
set -g mouse on

# Barra azul oscuro, para distinguir este servidor del de siempre.
# Error 3: sin -g, set busca la sesión actual. Al leer la config al arrancar
# no hay ninguna: fallaba con "no current session", que con new -d nadie ve.
set -g status-style bg=colour24,fg=colour255

setw -g mode-keys vi
