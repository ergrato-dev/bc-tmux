# ============================================================
# Lab 04 — Recarga en caliente
# Semana 05: Configuración y alcance de opciones
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/starter/tmux.conf"
# ============================================================

# Directorio de esta config, guardado al leerla: current_file solo existe
# mientras se lee el archivo.
set -gF @lab-dir "#{d:current_file}"

set -g  base-index 1
set -g  status-position top

# Que copy-command vea el Wayland de la sesión gráfica al conectarte desde
# ella (semana 04).
set -ga update-environment WAYLAND_DISPLAY

