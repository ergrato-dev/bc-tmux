# ============================================================
# Lab 04 — Recarga en caliente (SOLUCIÓN)
# ============================================================

set -gF @lab-dir "#{d:current_file}"

set -g  base-index 1
# Paso 3: status-position top ya no está. Recargar no la devuelve a bottom:
# hizo falta un set -gu a mano (o reiniciar el servidor).

# Paso 4: -gu vuelve al valor por defecto y -ga añade. El resultado es el
# mismo tras una recarga o tras diez.
set -gu update-environment
set -ga update-environment WAYLAND_DISPLAY

# -F expande @lab-dir al pulsar la tecla. Si el archivo no existe, source-file
# falla y el display no se ejecuta: no ver el mensaje es el aviso.
bind r source-file -F "#{@lab-dir}/tmux.conf" \; display "config recargada"
