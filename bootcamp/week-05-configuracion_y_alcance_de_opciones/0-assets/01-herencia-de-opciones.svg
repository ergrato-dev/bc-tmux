<svg viewBox="0 0 900 450" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Herencia de opciones en tmux: las sesiones heredan de la sesión global, las ventanas de la ventana global y los paneles de su ventana; las opciones de servidor tienen un único valor y no se heredan</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- servidor -->
    <rect x="30" y="40" width="210" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="135" y="66" fill="#f0f6fc" text-anchor="middle">servidor</text>
    <text x="135" y="88" fill="#8b949e" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">set -s escape-time 10</text>
    <text x="135" y="134" fill="#d2a8ff" text-anchor="middle" font-size="13">un único valor:</text>
    <text x="135" y="154" fill="#d2a8ff" text-anchor="middle" font-size="13">no se hereda</text>

    <!-- sesión global -->
    <rect x="290" y="40" width="250" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="415" y="66" fill="#f0f6fc" text-anchor="middle">sesión global</text>
    <text x="415" y="88" fill="#8b949e" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">set -g status-style bg=blue</text>
    <line x1="380" y1="104" x2="345" y2="166" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="104" x2="485" y2="166" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="285" y="170" width="120" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="345" y="195" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">api</text>
    <text x="345" y="216" fill="#e3b341" text-anchor="middle" font-size="12">bg=red (propio)</text>
    <rect x="425" y="170" width="120" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="485" y="195" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">web</text>
    <text x="485" y="216" fill="#8b949e" text-anchor="middle" font-size="12">bg=blue*</text>

    <!-- ventana global -->
    <rect x="590" y="40" width="280" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="730" y="66" fill="#f0f6fc" text-anchor="middle">ventana global</text>
    <text x="730" y="88" fill="#8b949e" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">setw -g remain-on-exit off</text>
    <line x1="700" y1="104" x2="665" y2="166" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="770" y1="104" x2="805" y2="166" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="600" y="170" width="130" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="665" y="195" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">api:1</text>
    <text x="665" y="216" fill="#8b949e" text-anchor="middle" font-size="12">off*</text>
    <rect x="740" y="170" width="130" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="805" y="195" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">api:2</text>
    <text x="805" y="216" fill="#8b949e" text-anchor="middle" font-size="12">off*</text>

    <!-- paneles -->
    <line x1="640" y1="230" x2="602" y2="296" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="690" y1="230" x2="724" y2="296" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="550" y="300" width="105" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="602" y="325" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">%1</text>
    <text x="602" y="346" fill="#8b949e" text-anchor="middle" font-size="12">off*</text>
    <rect x="672" y="300" width="105" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="724" y="325" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">%2</text>
    <text x="724" y="346" fill="#e3b341" text-anchor="middle" font-size="12">on (propio)</text>

    <text x="30" y="404" fill="#e3b341" font-size="13">Gana el nivel más concreto que tenga valor. Lo marcado con * es heredado: así lo enseña show -A.</text>
    <text x="30" y="428" fill="#8b949e" font-size="13">Las opciones de sesión no bajan a ventanas ni paneles: son de otra rama.</text>
  </g>
</svg>
