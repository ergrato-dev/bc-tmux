# tmux-kit — configuración (semana 04: copy mode y portapapeles).
#
# TODO 1: deja este archivo como punto de entrada, sin opciones ni teclas:
#         - guarda el directorio del kit: set -gF @kit-dir "#{d:current_file}"
#         - carga los módulos: source-file -F "#{@kit-dir}/conf.d/*.conf"
#         - y, si existe, local.conf: source-file -qF "#{@kit-dir}/local.conf"
#         Mueve cada línea de abajo a su módulo de conf.d/.

# Teclas vi en copy mode (v selecciona, y copia, / busca), fijadas: sin esta
# línea, tmux las elige según $VISUAL/$EDITOR al arrancar.
setw -g mode-keys vi

# Más historial para copy mode y capture-pane (por defecto, 2000 líneas).
# Solo afecta a los paneles nuevos.
set -g history-limit 50000

# "on": tmux envía lo que copias a la terminal exterior con OSC 52, y los
# programas de dentro (un editor por SSH, kit-copy en un pipe) también
# pueden usarlo.
set -s set-clipboard on

# copy-pipe sin comando usa copy-command, también al soltar el ratón.
# -F expande el formato al leer el archivo: current_file es este tmux.conf,
# así que la ruta funciona dondequiera que esté el kit. Debe ser absoluta
# (copy-command se ejecuta desde $HOME): lo es desde ~/.config/tmux o con
# tmux -f "$PWD/tmux.conf"; con -f relativo, no.
set -sF copy-command "#{d:current_file}/bin/kit-copy"

bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
