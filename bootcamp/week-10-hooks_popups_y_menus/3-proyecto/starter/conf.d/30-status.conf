# 30-status.conf — status line del kit, sin plugins: solo formats de tmux.
#
# Todo se escribe con set -g (sin -F): los #{...} se guardan tal cual y tmux
# los expande cada vez que dibuja la barra. Por eso cambiar una opción en
# caliente (tmux set -g @kit-color-accent red) cambia la barra al momento,
# sin recargar. Pruébalos con: tmux display -p '#{E:status-left}'

# --- Paleta y opciones del kit -----------------------------------------------

# Los colores viven aquí y en ningún otro sitio. Hex de GitHub dark; con una
# terminal sin color verdadero, tmux los aproxima a la paleta de 256.
set -g @kit-color-bg     "#161b22"
set -g @kit-color-fg     "#8b949e"
set -g @kit-color-accent "#3fb950"
set -g @kit-color-alert  "#f78166"
set -g @kit-color-warn   "#e3b341"

# off: la derecha no ejecuta kit-git-branch (útil en un repo enorme o en un
# disco de red lento). tmux set -g @kit-status-git off
set -g @kit-status-git on

# --- Barra -------------------------------------------------------------------

# Cada cuánto se redibuja y se vuelven a lanzar los #(...). 15 (el valor por
# defecto) deja la rama vieja un buen rato tras un git switch; 1 lanzaría
# kit-git-branch cada segundo por cada cliente.
set -g status-interval 5
set -g status-justify left
# Las opciones *-style también aceptan formats: se expanden al dibujar.
set -g status-style "fg=#{@kit-color-fg},bg=#{@kit-color-bg}"
set -g message-style "fg=#{@kit-color-bg},bg=#{@kit-color-warn}"
set -g pane-active-border-style "fg=#{@kit-color-accent}"

# --- Izquierda: sesión, prefix y modo resize ---------------------------------

# La sesión con fondo de acento; con el prefix pulsado (client_prefix), con
# fondo de alerta: así sabes que tmux espera la segunda tecla. client_prefix
# vale 1 en cualquier tabla que no sea root, así que también se enciende en
# el modo resize.
# En el modo resize (tabla kit-resize, 20-bindings.conf) aparece RESIZE.
# Dentro de una rama de #{?...} las comas del estilo se escriben #, para que
# tmux no las tome por el separador del condicional.
# =/20/…: el nombre se corta a 20 caracteres con … y nunca empuja a RESIZE
# fuera de status-left-length.
set -g status-left-length 40
set -g status-left "#[fg=#{@kit-color-bg},bg=#{?client_prefix,#{@kit-color-alert},#{@kit-color-accent}},bold] #{=/20/…:session_name} #[default]#{?#{==:#{client_key_table},kit-resize},#[fg=#{@kit-color-bg}#,bg=#{@kit-color-warn}#,bold] RESIZE #[default],} "

# --- Ventanas ----------------------------------------------------------------

# La etiqueta es la misma para la actual y las demás: se escribe una vez en
# @kit-window-label y los dos formats la expanden con E:. Lo que cambia es el
# estilo. ZOOM y SYNC en texto: se leen sin conocer los flags de tmux (Z, *).
# En la lista de ventanas, pane_* habla del panel activo de cada ventana.
# TODO 9: añade LOG al final de la etiqueta cuando el panel activo tenga un
# pipe abierto: #{?pane_pipe, LOG,}.
set -g @kit-window-label "#I:#W#{?window_zoomed_flag, ZOOM,}#{?pane_synchronized, SYNC,}"
set -g window-status-format         " #{E:@kit-window-label} "
set -g window-status-current-format " #{E:@kit-window-label} "
set -g window-status-style          "fg=#{@kit-color-fg},bg=#{@kit-color-bg}"
set -g window-status-current-style  "fg=#{@kit-color-bg},bg=#{@kit-color-accent},bold"
set -g window-status-separator ""

# --- Derecha: navegación, rama, host y hora ----------------------------------

# NAV off: C-h/j/k/l están pasando al programa (@kit-nav, 20-bindings.conf).
# Misma condición que las teclas: cualquier valor distinto de on es apagado.
#
# La rama la imprime bin/kit-git-branch con el directorio del panel activo.
# #(...) se ejecuta en segundo plano: la barra muestra la última salida y la
# renueva cada status-interval, así que un comando lento nunca congela tmux
# (solo enseña un valor viejo). tmux expande los #{} del comando antes de
# pasárselo a la shell: q: escapa espacios, $, ; y comillas de la ruta, que
# viene del panel y no controlas. Solo se lanza si @kit-status-git vale on:
# tmux no expande la rama del condicional que no elige.
#
# %H:%M se expande con strftime, como en date.
set -g status-right-length 80
set -g status-right "#{?#{!=:#{@kit-nav},on},#[fg=#{@kit-color-warn}#,bold]NAV off #[default],}#{?#{==:#{@kit-status-git},on},#[fg=#{@kit-color-accent}]#(#{q:@kit-dir}/bin/kit-git-branch #{q:pane_current_path}) #[default],}#{host_short} %H:%M "
