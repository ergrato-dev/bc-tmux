# lab-02 — popups: ventanas flotantes que lanzan un comando encima del panel.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s lab

# Carpeta de este archivo: los bindings encuentran popup-info.sh sin
# depender del directorio desde el que arrancaste tmux.
set -gF @lab-dir "#{d:current_file}"

# En 3.4 el comando del popup no se expande como format (#{@lab-dir} llegaría
# literal): la ruta la pregunta la shell del popup, cuyo $TMUX ya apunta aquí.
bind y display-popup -E -w 60% -h 40% -T " info " 'exec "$(tmux show -gv @lab-dir)/popup-info.sh"'

# -E: al salir de top con q se cierra también el popup.
bind u display-popup -E -w 90% -h 90% top
