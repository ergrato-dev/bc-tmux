# lab-01 — hooks: comandos que tmux ejecuta solo cuando pasa algo.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s lab

# Cuántas ventanas se crearon desde la última carga: lo sube el hook de abajo.
set -g @lab-windows 0

# Índice fijo [10]: recargar sustituye la entrada en vez de añadir otra.
set-hook -g after-new-window[10] 'set -gF @lab-windows "#{e|+:#{@lab-windows},1}"'

set-hook -g session-created[10] 'set -gF @lab-last-session "#{hook_session_name}"'

# #{hook_pane} sale vacío en los hooks after-* de 3.4: el panel nuevo es #{pane_id}.
set-hook -g after-split-window[10] 'set -gF @lab-last-pane "hook=#{hook_pane} nuevo=#{pane_id}"'

# -d 3000: el mensaje dura 3 s, sin depender de display-time.
set-hook -g client-attached[10] 'display-message -d 3000 "lab: #{session_name} (#{session_windows} ventanas)"'
