# lab-01 — hooks: comandos que tmux ejecuta solo cuando pasa algo.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L lab -f "$PWD/starter/tmux.conf" new -d -s lab
# Recargar tras editar:
#   tmux -L lab source-file "$PWD/starter/tmux.conf"

# Cuántas ventanas se crearon desde la última carga: lo sube el hook de abajo.
set -g @lab-windows 0

# TODO 1: -ga añade una entrada más en cada recarga y el contador acaba
# subiendo de dos en dos. Cambia "set-hook -ga after-new-window" por
# "set-hook -g after-new-window[10]": un índice fijo sustituye siempre la
# misma entrada.
set-hook -ga after-new-window 'set -gF @lab-windows "#{e|+:#{@lab-windows},1}"'

