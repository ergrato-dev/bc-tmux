# lab-06 — la config de hooks, popups y prompts, arreglada.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s lab

# Fallo 1: -ga añadía otra entrada en cada recarga (dos, tres saludos).
# Un índice fijo sustituye siempre la misma.
set-hook -g client-attached[10] 'display-message -d 3000 "hola, #{session_name}"'

# Fallo 2: el tmux lanzado por run-shell es un cliente nuevo y su split
# volvía a disparar el hook, hasta quedarse sin sitio. Un comando escrito
# directamente en el hook no dispara hooks. Sin -t actúa sobre el panel
# nuevo; -t "#{pane_id}" no serviría: fuera de run-shell no se expande.
set-hook -g after-split-window[10] 'split-window -d -v -l 5'

# Fallo 3: sin -E el popup se quedaba abierto y vacío al salir de top.
bind u display-popup -E -w 90% -h 90% top

# Fallo 4: una plantilla de texto con "%%" vuelve a leer lo escrito como
# comandos; un nombre con comillas los ejecutaba. Entre llaves, no.
bind , command-prompt -I "#W" -p "nombre:" { rename-window -- "%%" }

# Fallo 5: sin -b, el cliente no atendía teclas durante los 5 s.
bind b run-shell -b 'sleep 5; echo copia hecha'
