# lab-06 — la config de hooks, popups y prompts de un compañero.
# Tiene cinco fallos. Ninguno da error al cargar: los ves al usarla.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L lab -f "$PWD/starter/tmux.conf" new -d -s lab
# Recargar tras editar:
#   tmux -L lab source-file "$PWD/starter/tmux.conf"

# Saludo al conectarse.
set-hook -ga client-attached 'display-message -d 3000 "hola, #{session_name}"'

# Cada split añade debajo un panel de notas de 5 líneas.
set-hook -g after-split-window 'run-shell "tmux split-window -d -v -l 5 -t #{pane_id}"'

# prefix u: top en grande; al salir de top, el popup se cierra.
bind u display-popup -w 90% -h 90% top

# prefix ,: renombrar la ventana con el nombre actual ya escrito.
bind , command-prompt -I "#W" -p "nombre:" 'rename-window -- "%%"'

# prefix b: copia de seguridad (simulada) sin bloquear nada.
bind b run-shell 'sleep 5; echo copia hecha'
