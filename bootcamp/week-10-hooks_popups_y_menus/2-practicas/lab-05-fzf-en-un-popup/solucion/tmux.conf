# lab-05 — un selector de sesiones con fzf dentro de un popup.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s lab

# Carpeta de este archivo: el binding encuentra pick-session.sh.
set -gF @lab-dir "#{d:current_file}"

# -E: el popup se cierra al elegir o al cancelar. En 3.4 el comando del popup
# no se expande como format: la ruta la pregunta la shell del popup.
bind O display-popup -E -w 50% -h 50% -T " sesiones " 'exec "$(tmux show -gv @lab-dir)/pick-session.sh"'
