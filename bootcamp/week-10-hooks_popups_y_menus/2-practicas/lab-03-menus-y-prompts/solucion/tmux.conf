# lab-03 — menús, prompts y confirmaciones.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s lab

# Las entradas del menú se expanden como format al abrirlo: por eso no
# llevan #W (un nombre con comillas rompería el comando).
bind K display-menu -T " lab " -x C -y C \
  "Nueva ventana" n new-window \
  "Dividir en vertical" v "split-window -h" \
  "" \
  "Renombrar ventana" r { command-prompt -p "nombre:" { rename-window -- "%%" } } \
  "Cerrar ventana" x { confirm-before -p "cerrar la ventana? (y/n)" kill-window }

# Plantilla entre llaves: tmux mete lo escrito como valor del argumento sin
# volver a leer el comando, y unas comillas en el nombre no ejecutan nada.
# Entre comillas habría que escribir "%%%" (escapa las comillas).
bind , command-prompt -I "#W" -p "nombre:" { rename-window -- "%%" }

bind k confirm-before -p "cerrar las demás ventanas? (y/n)" "kill-window -a"
