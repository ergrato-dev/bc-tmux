# lab-03 — menús, prompts y confirmaciones.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L lab -f "$PWD/starter/tmux.conf" new -d -s lab
# Recargar tras editar:
#   tmux -L lab source-file "$PWD/starter/tmux.conf"

# TODO 1: prefix K abre el menú del lab, centrado (-x C -y C). Cada entrada
# es "Nombre" tecla comando; "" es una línea separadora. Las llaves { }
# agrupan un comando entero sin pelearte con las comillas:
#   bind K display-menu -T " lab " -x C -y C \
#     "Nueva ventana" n new-window \
#     "Dividir en vertical" v "split-window -h" \
#     "" \
#     "Renombrar ventana" r { command-prompt -p "nombre:" { rename-window -- "%%" } } \
#     "Cerrar ventana" x { confirm-before -p "cerrar la ventana? (y/n)" kill-window }

# Copiado de un blog: sustituye al prefix , de serie.
# TODO 2: la plantilla va entre comillas simples, como texto: tmux pega lo
# escrito en lugar de %% y vuelve a leer el comando entero, así que unas
# comillas en el nombre ejecutan lo que vaya detrás. Cambia las comillas
# simples por llaves, como el prefix , de serie:
#   bind , command-prompt -I "#W" -p "nombre:" { rename-window -- "%%" }
bind , command-prompt -I "#W" -p "nombre:" 'rename-window -- "%%"'

