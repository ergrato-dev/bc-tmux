# lab-04 — run-shell y pipe-pane.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L lab -f "$PWD/solucion/tmux.conf" new -d -s lab

# Carpeta de este archivo: los bindings encuentran pane-log.sh.
set -gF @lab-dir "#{d:current_file}"

# -b: la tarea corre en segundo plano y el cliente sigue respondiendo.
bind b run-shell -b 'sleep 3; echo copia hecha'

# run-shell sí expande formats: #{q:} cita la ruta para la shell.
bind H run-shell '#{q:@lab-dir}/pane-log.sh #{pane_id}'
