# lab-04 — run-shell y pipe-pane.
#
# Probar sin tocar tu sesión (desde la carpeta del lab):
#   tmux -L lab -f "$PWD/starter/tmux.conf" new -d -s lab
# Recargar tras editar:
#   tmux -L lab source-file "$PWD/starter/tmux.conf"

# Carpeta de este archivo: los bindings encuentran pane-log.sh.
set -gF @lab-dir "#{d:current_file}"

# Simula una tarea lenta (una copia, un fetch).
# TODO 4: sin -b, run-shell bloquea al cliente 3 s: las teclas que pulses
# esperan a que termine. Añade -b para que corra en segundo plano:
#   bind b run-shell -b 'sleep 3; echo copia hecha'
bind b run-shell 'sleep 3; echo copia hecha'

