# ============================================================
# Lab 03 — Tablas propias: un modo resize (SOLUCIÓN)
# ============================================================

set -g status-right "tabla: #{client_key_table} "

bind -N "lab: modo resize" R switch-client -T resize

# Tras cada tecla el cliente vuelve a root: el switch-client del final lo
# devuelve a resize. El modo dura hasta q, Escape o Enter.
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize

bind -T resize q      switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize Enter  switch-client -T root

# Con -r el modo se cierra solo tras repeat-time sin pulsar.
bind -r -T resize H resize-pane -L 1
bind -r -T resize J resize-pane -D 1
bind -r -T resize K resize-pane -U 1
bind -r -T resize L resize-pane -R 1
