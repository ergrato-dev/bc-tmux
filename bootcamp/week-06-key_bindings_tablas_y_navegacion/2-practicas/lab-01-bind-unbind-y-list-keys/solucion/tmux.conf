# ============================================================
# Lab 01 — bind, unbind y list-keys (SOLUCIÓN)
# ============================================================

# Una sola línea por tecla: un bind posterior la pisaría sin avisar y, si no
# lleva -N, borraría también la nota.
bind -N "lab: marcar el panel" m select-pane -m

bind -N "lab: dividir a los lados" | split-window -h
bind -N "lab: dividir arriba y abajo" - split-window -v

# Sin unbind, " y % siguen dividiendo: dos teclas para lo mismo y dos teclas
# menos para lo tuyo.
unbind '"'
unbind %
