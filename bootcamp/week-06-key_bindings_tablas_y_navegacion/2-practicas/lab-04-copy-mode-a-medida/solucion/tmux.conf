# ============================================================
# Lab 04 — Copy mode a medida (SOLUCIÓN)
# ============================================================

setw -g mode-keys vi

# La selección rectangular sigue en C-v (de serie).
bind -T copy-mode-vi v send -X begin-selection

# El if hace que y sin selección salga del copy mode en vez de no hacer nada,
# y que "copiado" solo aparezca cuando de verdad se copió algo.
bind -T copy-mode-vi y {
  if -F '#{selection_present}' {
    send -X copy-selection-and-cancel
    display 'copiado'
  } {
    send -X cancel
  }
}

bind C-y {
  copy-mode
  send -X cursor-up
  send -X select-line
  send -X copy-selection-and-cancel
  display 'línea copiada'
}

# command-prompt sustituye %% por lo que escribes.
bind / {
  copy-mode
  command-prompt -p 'buscar:' {
    send -X search-backward '%%'
  }
}
