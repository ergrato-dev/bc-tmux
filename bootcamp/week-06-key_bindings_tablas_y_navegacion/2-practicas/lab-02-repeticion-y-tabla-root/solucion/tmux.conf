# ============================================================
# Lab 02 — Repetición (-r) y la tabla root (-n) (SOLUCIÓN)
# ============================================================

# -r: tras prefix H, más H durante repeat-time (500 ms) siguen
# redimensionando sin prefix. Pisa prefix L (última sesión).
bind -r -N "lab: borde a la izquierda" H resize-pane -L 5
bind -r -N "lab: borde abajo"          J resize-pane -D 5
bind -r -N "lab: borde arriba"         K resize-pane -U 5
bind -r -N "lab: borde a la derecha"   L resize-pane -R 5

# Las de serie llevan -r: la flecha que pulsas justo después para el
# historial de la shell cambiaba otra vez de panel.
bind Up    select-pane -U
bind Down  select-pane -D
bind Left  select-pane -L
bind Right select-pane -R

# Root: sin prefix. Alt + flecha deja de llegar a los programas del panel.
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
