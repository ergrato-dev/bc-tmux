# ============================================================
# Lab 06 — Teclas rotas: la config de un compañero
# Semana 06: Key bindings, tablas y navegación
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/starter/tmux.conf" new -d -s lab
# Tiene CINCO errores a propósito. Prefix: C-a.
# ============================================================

set -gF @lab-dir "#{d:current_file}"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

setw -g mode-keys vi
set -g status-right "tabla: #{client_key_table} "

# Modo resize: prefix R, después h j k l; q o Escape para salir.
bind -N "modo resize" R switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize q      switch-client -T root
bind -T resize Escape switch-client -T root

# Ventanas nuevas en el directorio del panel.
bind -r c new-window -c "#{pane_current_path}"

# Copy mode con prefix Enter, más cómodo que prefix [.
bind -n Enter copy-mode

# Que prefix Space no me cambie el layout sin querer.
unbind -n Space

# prefix S sincroniza los paneles y avisa al activarlo.
bind S if -F '#{synchronize-panes}' 'setw synchronize-panes off' 'setw synchronize-panes on ; display 'cuidado: sync on''

# Recargar.
bind R source-file -F "#{@lab-dir}/tmux.conf" \; display "config recargada"
