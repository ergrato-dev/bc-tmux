# ============================================================
# Lab 06 — Teclas rotas: la config de un compañero (SOLUCIÓN)
# ============================================================

set -gF @lab-dir "#{d:current_file}"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

setw -g mode-keys vi
set -g status-right "tabla: #{client_key_table} "

# Modo resize: prefix R, después h j k l; q o Escape para salir.
bind -N "modo resize" R switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize q      switch-client -T root
bind -T resize Escape switch-client -T root

# Error 4: sin -r. Con -r, la c de "cd" tecleada justo después abría otra
# ventana.
bind c new-window -c "#{pane_current_path}"

# Error 3: tabla prefix, no root. En root, Enter no llegaba a ningún
# programa y en copy mode no copiaba.
bind Enter copy-mode

# Error 5: Space está en la tabla prefix; unbind -n la buscaba en root, donde
# no existe, y no avisaba.
unbind Space

# Error 2: comillas simples dentro de comillas simples partían el argumento
# en cuatro ("too many arguments"). Con bloques no hay que anidar comillas.
bind S if -F '#{synchronize-panes}' {
  setw synchronize-panes off
} {
  setw synchronize-panes on
  display 'cuidado: sync on'
}

# Error 1: R ya era el modo resize y esta línea, más abajo, lo pisaba.
bind r source-file -F "#{@lab-dir}/tmux.conf" \; display "config recargada"
