# ============================================================
# Lab 05 — Navegación consciente: C-h/j/k/l sin prefix (SOLUCIÓN)
# ============================================================

# alternate_on es 1 cuando el programa del panel usa la pantalla alternativa
# (less, watch, editores): entonces la tecla es suya. pane_current_command no
# sirve: con "seq 100 | less" dice bash, y por SSH dice ssh.
bind -n C-h if -F '#{alternate_on}' 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F '#{alternate_on}' 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F '#{alternate_on}' 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F '#{alternate_on}' 'send-keys C-l' 'select-pane -R'

# En la shell, C-l limpiaba la pantalla: ahora es prefix C-l.
bind C-l send-keys C-l
