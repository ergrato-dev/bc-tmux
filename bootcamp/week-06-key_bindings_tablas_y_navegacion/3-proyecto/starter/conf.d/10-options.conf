# 10-options.conf — opciones del kit, agrupadas por alcance.
# Cada set lleva su flag explícito: -s servidor, -g sesión global,
# setw -g ventana global. Así se lee de un vistazo dónde vive cada una.

# --- Servidor (una para todo el servidor) ------------------------------------

# En 3.4 el valor por defecto es 500 ms: tras cada Esc, tmux espera medio
# segundo por si es el inicio de una secuencia (una flecha, Alt+tecla), y el
# programa del panel recibe el Esc tarde. 10 ms basta en local; por SSH lento,
# si una flecha llega partida, súbelo.
set -s escape-time 10

# tmux envía lo que copias a la terminal exterior con OSC 52 y acepta el de los
# programas de los paneles (un programa remoto que emite OSC 52). Semana 04.
set -s set-clipboard on

# copy-pipe sin comando usa este. @kit-dir es absoluta: copy-command se
# ejecuta desde $HOME y una ruta relativa no se encontraría.
set -sF copy-command "#{@kit-dir}/bin/kit-copy"

# --- Sesión (valor global que heredan todas las sesiones) --------------------

# Ventanas desde 1: la tecla 1 está a la izquierda, la 0 al final del teclado.
set -g base-index 1
# Al cerrar una ventana, las demás se renumeran: sin huecos 1, 3, 4.
set -g renumber-windows on
# Solo afecta a los paneles nuevos.
set -g history-limit 50000
set -g mouse on
# TODO 6: opción de usuario @kit-nav a on (set -g @kit-nav on). Con off, las
#         teclas C-h/j/k/l del TODO 7 llegan siempre al programa del panel.

# update-environment es una lista: set -ga añadiría WAYLAND_DISPLAY otra vez en
# cada recarga. -u la devuelve a su valor por defecto y después se añade: el
# resultado es el mismo por muchas veces que recargues.
# WAYLAND_DISPLAY: si arrancaste el servidor por SSH y luego te conectas desde
# el escritorio, kit-copy ve el Wayland de la sesión gráfica.
set -gu update-environment
set -ga update-environment WAYLAND_DISPLAY

# --- Ventana (valor global que heredan todas las ventanas y paneles) ---------

# Explícito: sin esto, tmux elige vi o emacs según $EDITOR. Semana 04.
setw -g mode-keys vi
# Paneles desde 1, igual que las ventanas.
setw -g pane-base-index 1
