# tmux-kit — punto de entrada (semana 05).
# Solo fija dónde está el kit y carga los módulos de conf.d/, en orden.
#
# Instálalo enlazando el directorio entero:
#   ln -s ~/tmux-kit ~/.config/tmux
# Para probarlo sin instalar, siempre con ruta absoluta:
#   tmux -L kit -f "$PWD/tmux.conf"

# Directorio del kit. current_file solo existe mientras se lee este archivo;
# la tecla de recarga y copy-command lo necesitan después, así que se guarda
# en una opción de usuario (-F expande el formato una vez, aquí).
set -gF @kit-dir "#{d:current_file}"

# El glob se ordena por nombre: 10- antes que 20-. Con -F la ruta sale de
# @kit-dir, no del directorio desde el que arrancaste tmux.
source-file -F "#{@kit-dir}/conf.d/*.conf"

# Ajustes de esta máquina, fuera del repositorio (está en .gitignore).
# -q: si no existe, no es un error.
source-file -qF "#{@kit-dir}/local.conf"
