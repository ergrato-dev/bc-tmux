# tmux-kit — configuración (semana 04: copy mode y portapapeles).
# En la semana 05 este archivo se divide en conf.d/.
#
# Instálalo enlazando el directorio entero, para que tmux encuentre bin/:
#   ln -s ~/tmux-kit ~/.config/tmux

# TODO 1: teclas vi en copy mode (mode-keys, opción de ventana, global).
#         Pista: setw -g mode-keys vi

# TODO 2: history-limit de al menos 10000 líneas.
#         Pista: set -g history-limit 50000

# TODO 3: set-clipboard on (opción de servidor: set -s).
#         Pista: set -s set-clipboard on

# TODO 4: copy-command apuntando a bin/kit-copiar de este kit. Con set -sF y
#         "#{d:current_file}" la ruta sale del propio tmux.conf. Pruébalo
#         con tmux -f "$PWD/tmux.conf": copy-command se ejecuta desde $HOME
#         y una ruta relativa no se encontraría.
#         Pista: set -sF copy-command "#{d:current_file}/bin/kit-copiar"

