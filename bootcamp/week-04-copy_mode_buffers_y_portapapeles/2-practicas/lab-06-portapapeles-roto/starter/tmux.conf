# ============================================================
# Lab 06 — El portapapeles roto
# Semana 04: Copy mode, buffers y portapapeles
# Pruébalo sin tocar tu sesión: tmux -L lab -f "$PWD/starter/tmux.conf"
#
# La config de un compañero para trabajar por SSH: copia con OSC 52, sin
# herramientas del sistema. "En mi máquina funcionaba". No copia nada.
# ============================================================

setw -g mode-keys vi
set -g  history-limit 50000
set -g  mouse on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Que los programas de los paneles no toquen mi portapapeles.
set -s set-clipboard off

# Mi terminal antigua imprimía basura al copiar; sin Ms dejó de hacerlo.
set -ga terminal-overrides ',*:Ms@'

# prefix Y: envía el buffer más reciente al portapapeles.
set -gF @lab-dir "#{d:current_file}"
bind Y run-shell 'tmux save-buffer - | "#{@lab-dir}/osc52.sh"'
