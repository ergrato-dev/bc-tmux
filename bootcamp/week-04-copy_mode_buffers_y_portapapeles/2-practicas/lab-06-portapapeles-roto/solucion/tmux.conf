# ============================================================
# Lab 06 — El portapapeles roto (SOLUCIÓN)
# ============================================================

setw -g mode-keys vi
set -g  history-limit 50000
set -g  mouse on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Error 1: off apaga también el OSC 52 que envía tmux al copiar. "on" deja
# además que los programas del panel (nvim por SSH) lo usen; "external"
# bastaría si no quieres eso.
set -s set-clipboard on

# Error 2: borrada la línea set -ga terminal-overrides ',*:Ms@'. Ms es la
# capacidad de terminfo que dice cómo enviar OSC 52; quitarla para todas las
# terminales (*) apaga el portapapeles en cualquiera.

# La ruta se fija al leer el archivo: en run-shell, current_file no existe.
set -gF @lab-dir "#{d:current_file}"
# Error 3 está en osc52.sh: run-shell no tiene tty.
bind Y run-shell 'tmux save-buffer - | "#{@lab-dir}/osc52.sh"'
