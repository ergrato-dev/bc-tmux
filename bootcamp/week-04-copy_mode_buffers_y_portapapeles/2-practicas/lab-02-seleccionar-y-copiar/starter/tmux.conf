# ============================================================
# Lab 02 — Seleccionar y copiar
# Semana 04: Copy mode, buffers y portapapeles
# Pruébalo sin tocar tu sesión: tmux -L lab -f starter/tmux.conf
# ============================================================

setw -g mode-keys vi
set -g  history-limit 50000

# Destino de copy-pipe cuando no lleva comando. En este lab, un archivo: así
# ves qué recibe el comando sin depender de tu portapapeles (lab 05).
set -s copy-command 'cat > /tmp/lab-copia.txt'

