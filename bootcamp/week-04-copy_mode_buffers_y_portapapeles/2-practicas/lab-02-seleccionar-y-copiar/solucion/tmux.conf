# ============================================================
# Lab 02 — Seleccionar y copiar (SOLUCIÓN)
# ============================================================

setw -g mode-keys vi
set -g  history-limit 50000

set -s copy-command 'cat > /tmp/lab-copia.txt'

# Las teclas de copy mode son órdenes del modo (-X), no comandos de tmux.
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
# Sin comando, copy-pipe usa copy-command: el mismo destino que Enter y que
# soltar el ratón, definido en un solo sitio.
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel

# Arrastrar selecciona en copy mode y al soltar copia con copy-command.
set -g mouse on
