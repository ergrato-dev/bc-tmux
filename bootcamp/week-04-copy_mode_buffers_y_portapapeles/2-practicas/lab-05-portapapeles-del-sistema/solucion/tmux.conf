# ============================================================
# Lab 05 — Portapapeles del sistema (SOLUCIÓN)
# ============================================================

setw -g mode-keys vi
set -g  history-limit 50000
set -g  mouse on

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel

# -F expande el formato una vez, al leer este archivo: current_file solo
# existe mientras se lee la config. Es absoluta si arrancas con
# -f "$PWD/starter/tmux.conf" o desde ~/.config/tmux; con -f relativo no, y
# copy-command, que se ejecuta desde $HOME, no encontraría el script.
set -sF copy-command "#{d:current_file}/copiar.sh"
