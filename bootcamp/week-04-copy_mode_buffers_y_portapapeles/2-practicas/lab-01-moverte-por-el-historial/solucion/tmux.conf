# ============================================================
# Lab 01 — Moverte por el historial (SOLUCIÓN)
# ============================================================

# Explícito: sin esta línea, tmux elige vi o emacs según $EDITOR al arrancar
# el servidor, y la misma config se comporta distinto en otra máquina.
setw -g mode-keys vi

# Se lee al crear cada panel: los que ya existen conservan su límite.
set -g history-limit 50000
