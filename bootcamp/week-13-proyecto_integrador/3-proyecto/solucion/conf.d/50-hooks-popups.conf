# 50-hooks-popups.conf — hooks, popup de proyectos y menú del kit (semana 10).
#
# Ver lo que quedó: tmux show-hooks -g | grep kit ; tmux list-keys -T prefix P

# --- Opciones del kit --------------------------------------------------------

# Dónde están tus repositorios: kit-projects lista sus subdirectorios. Entre
# comillas dobles tmux expande la ~ al leer la config; con comillas simples
# llega tal cual y la expande el script.
set -g @kit-projects-dir "~/src"
# on: cada ventana y panel nuevo empieza con log (bin/kit-log). Cuesta disco:
# todo lo que sale en pantalla, también contraseñas que se ven al teclear.
set -g @kit-autolog off

# --- Hooks -------------------------------------------------------------------

# Los hooks son opciones de lista: set-hook -ga añade una entrada en cada
# recarga y prefix r los duplicaría (el mensaje saldría dos, tres veces...).
# Un índice fijo, [50], sustituye siempre la misma entrada: recargar deja lo
# mismo, y los índices 0-49 quedan libres para local.conf.

# Al conectarte, la sesión y cuántas ventanas tiene. -d: 2 s, no el
# display-time del servidor.
set-hook -g client-attached[50] {
  display-message -d 2000 "kit: #{session_name} (#{session_windows} ventanas)"
}

# Autolog. En un hook after-*, #{pane_id} es el panel que acaba de crear el
# comando (#{hook_pane} sale vacío en 3.4). if -F decide dentro de tmux: el
# valor de @kit-autolog nunca llega a una shell. run-shell (sin -b) espera
# a kit-log: así new-window termina con el log ya abierto. Su salida iría al
# modo vista del panel: se tira.
# Ojo: los hooks saltan también con los comandos de los scripts (dev-up,
# kit-layout). Por eso @kit-autolog está apagado por defecto.
# Tres eventos: new-session no lanza after-new-window, sino session-created.
set-hook -g after-new-window[50] {
  if -F "#{==:#{@kit-autolog},on}" {
    run-shell "#{q:@kit-dir}/bin/kit-log #{pane_id} >/dev/null"
  }
}
set-hook -g after-split-window[50] {
  if -F "#{==:#{@kit-autolog},on}" {
    run-shell "#{q:@kit-dir}/bin/kit-log #{pane_id} >/dev/null"
  }
}
set-hook -g session-created[50] {
  if -F "#{==:#{@kit-autolog},on}" {
    run-shell "#{q:@kit-dir}/bin/kit-log #{pane_id} >/dev/null"
  }
}

# --- Popup de proyectos ------------------------------------------------------

# prefix P está libre en 3.4 (prefix p es la ventana anterior). -EE: si
# kit-projects termina bien (o lo cancelas), el popup se cierra; si falla, se
# queda con el error a la vista hasta que pulses Escape.
# En 3.4 el comando del popup NO se expande como format (#{@kit-dir} llegaría
# literal a la shell): la ruta del kit se pregunta desde dentro. $TMUX ya
# apunta a este servidor, así que tmux show habla con él sin -L.
bind -N "kit: elige un proyecto (popup)" P display-popup -EE -w 60% -h 60% -T " proyectos " \
  'exec "$(tmux show -gv @kit-dir)/bin/kit-projects"'

# --- Menú del kit ------------------------------------------------------------

# prefix K ("kit"): libre en 3.4. prefix M no: es select-pane -M.
# display-menu expande nombres y comandos como formats al abrirse: las
# etiquetas dicen el estado actual (Apagar o Encender) y el set -F del
# toggle se calcula con el valor de ese momento.
# Cerrar la sesión pasa por confirm-before: n o Escape no hacen nada. El
# nombre de la sesión no se mete en el comando (una ' en el nombre lo
# rompería): kill-session sin -t cierra la del cliente.
# kit-doctor va en un popup sin -E: sigue abierto con el informe hasta que
# pulses Escape.
bind -N "kit: menú del kit" K display-menu -T "#[align=centre] tmux-kit " -x C -y C \
  "Abrir proyecto"                       p 'display-popup -EE -w 60% -h 60% -T " proyectos " "exec \"\$(tmux show -gv @kit-dir)/bin/kit-projects\""' \
  "Cerrar esta sesión"                   x 'confirm-before -p "¿cerrar la sesión? (y/n)" kill-session' \
  "" \
  "#{?pane_pipe,Parar,Empezar} log del panel"                          l 'run-shell "#{q:@kit-dir}/bin/kit-log #{pane_id} >/dev/null"' \
  "#{?#{==:#{@kit-nav},on},Apagar,Encender} navegación C-h/j/k/l"     n 'set -gF @kit-nav "#{?#{==:#{@kit-nav},on},off,on}"' \
  "#{?#{==:#{@kit-status-git},on},Ocultar,Mostrar} rama git"          g 'set -gF @kit-status-git "#{?#{==:#{@kit-status-git},on},off,on}"' \
  "" \
  "kit-doctor"                           d 'display-popup -w 80 -h 20 -T " kit-doctor " "exec \"\$(tmux show -gv @kit-dir)/bin/kit-doctor\""'
