# 60-plugins.conf — el plugin propio del kit y los de terceros con TPM (semana 11).
#
# Sin TPM instalado todo esto carga sin error: el plugin propio va con
# run-shell y TPM solo se ejecuta si existe. Instálalo con bin/kit-plugins install.
# Ver lo que quedó: tmux show -gv @tpm_plugins ; bin/kit-plugins list

# --- Plugin propio -----------------------------------------------------------

# Va después de 30-status.conf (el glob ordena por nombre) porque sustituye
# marcadores que esa config deja en status-right. Sin -b, la config espera a
# que termine. q: escapa la ruta del kit para la shell.
run-shell "#{q:@kit-dir}/plugin/tmux-kit.tmux"

# --- Plugins de terceros -----------------------------------------------------

# TPM no le pregunta a tmux por los set -g @plugin: los busca con awk en
# ~/.config/tmux/tmux.conf y en los source-file con ruta literal de ese
# archivo. El source-file -F "#{@kit-dir}/conf.d/*.conf" del kit no lo
# entiende: install_plugins sale con 0 sin instalar nada. @tpm_plugins (la
# forma antigua, que TPM 3.1.0 sigue leyendo) sí se le pide al servidor, así
# que funciona con cualquier estructura de config. Es una sola opción:
# recargar la sustituye, no la duplica.
# Siempre usuario/repo#tag: sin tag, TPM clona lo que haya hoy en la rama por
# defecto y dos máquinas acaban con versiones distintas. Compruébalo con
# bin/kit-plugins check.
set -g @tpm_plugins '                 \
  tmux-plugins/tpm#v3.1.0             \
  tmux-plugins/tmux-resurrect#v4.0.0  \
  tmux-plugins/tmux-continuum#v3.1.0  \
'

# TPM instala en $TMUX_PLUGIN_MANAGER_PATH si ya existe. Dentro del kit
# (plugins/, en .gitignore) y no en ~/.config/tmux/plugins: una copia de
# pruebas (tmux -L kit -f "$PWD/tmux.conf") no carga los plugins de tu config
# real. Con el kit enlazado en ~/.config/tmux, las dos rutas son la misma. La
# barra final hace falta: TPM le pega el nombre del plugin detrás.
setenv -gF TMUX_PLUGIN_MANAGER_PATH "#{@kit-dir}/plugins/"

# resurrect v4.0.0 guarda en ~/.tmux/resurrect: aquí, en la ruta XDG de datos.
# Comillas simples: entre dobles, tmux cambia la ~ por tu HOME al leer la
# config; así la cambia resurrect cada vez que guarda o restaura.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
# Además del layout y los directorios, lo que se veía en cada panel.
set -g @resurrect-capture-pane-contents on

# continuum guarda cada 15 minutos desde un #(...) que añade a status-right:
# con la barra apagada no guarda nunca. on: al arrancar el servidor, restaura
# el último guardado.
set -g @continuum-save-interval 15
set -g @continuum-restore on

# --- TPM ---------------------------------------------------------------------

# Al final: TPM ejecuta los plugins con las opciones que ya estén puestas.
# (local.conf se lee después; lo que cambie ahí de plugins vale desde la
# siguiente recarga.) Sin el test, en una máquina sin TPM run-shell falla con
# 127 en cada arranque y source-file sale con error. if-shell expande el
# format antes de pasar el comando a la shell.
if-shell "test -x #{q:@kit-dir}/plugins/tpm/tpm" {
  run-shell "#{q:@kit-dir}/plugins/tpm/tpm"
}
