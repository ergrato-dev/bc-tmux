# 70-remote.conf — tmux por SSH y tmux dentro de tmux (semana 12).
#
# Pruébalo sin cliente real: un cliente de control mode recibe teclas con
# send-keys -K (3-proyecto/README.md, paso 1).

# --- Toggle de anidado: F12 --------------------------------------------------

# Con un tmux dentro de otro (tu portátil > ssh > servidor), el exterior se
# queda con el prefix y con todas sus teclas: el de dentro no recibe nada.
# F12 apaga el exterior en esta sesión: sin prefix y en la tabla off, que solo
# tiene F12. Todo lo demás pasa tal cual al programa del panel, el tmux de dentro.
# set sin -g cambia la opción de la sesión, no la global: las demás sesiones
# siguen igual.
bind -N "kit: apaga este tmux para el de dentro (F12 lo enciende)" -n F12 \
  set prefix None \; set key-table off

# set -u borra el valor de la sesión y vuelve a heredar el global, sea cual
# sea: no hace falta recordar el prefix de antes y si lo cambias en
# 20-bindings.conf el toggle no se entera. Recargar no toca nada de esto: la
# config solo pone valores globales.
bind -N "kit: enciende otra vez este tmux" -T off F12 \
  set -u prefix \; set -u key-table

# --- SSH ---------------------------------------------------------------------

# Un format no puede leer variables de entorno: if-shell sí. Se ejecuta al
# cargar la config, con el entorno del servidor, y SSH_CONNECTION solo existe
# si el servidor arrancó desde una sesión SSH.
# ponytail: mira cómo arrancó el servidor, no cómo está conectado cada cliente;
# un servidor local al que entras por SSH sigue siendo local.
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g @kit-remote on
  # Otro acento para el servidor remoto: con un tmux dentro de otro, la
  # barra azul es la de dentro y la verde la de fuera. Va después de
  # 30-status.conf, que lo pone verde en cada recarga.
  set -g @kit-color-accent "#58a6ff"
} {
  set -g @kit-remote off
}

# --- Indicadores -------------------------------------------------------------

# Va al principio de status-right (30-status.conf). key-table y
# @kit-pair-socket son opciones: un format las lee por su nombre, sin cliente.
# OFF: el toggle está apagado en esta sesión. PAIR: este es el servidor
# compartido de bin/kit-pair (lo marca kit-pair start).
set -g @kit-remote-label "#{?#{==:#{key-table},off},#[fg=#{@kit-color-bg}#,bg=#{@kit-color-warn}#,bold] OFF #[default] ,}#{?#{==:#{@kit-remote},on},#[fg=#{@kit-color-accent}#,bold]SSH #[default],}#{?#{!=:#{@kit-pair-socket},},#[fg=#{@kit-color-alert}#,bold]PAIR #[default],}"
