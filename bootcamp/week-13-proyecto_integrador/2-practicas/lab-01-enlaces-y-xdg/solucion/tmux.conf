# Kit mínimo del lab 01: el mismo punto de entrada que tmux-kit.
# Probarlo sin instalar (ruta absoluta):
#   tmux -L lab -f "$PWD/starter/tmux.conf" new -d -s lab
# Instalarlo es enlazar ESTE directorio en ~/.config/tmux (paso 3 del lab).

# Directorio real del kit, aunque tmux lo cargue a través de un enlace.
set -gF @kit-dir "#{d:current_file}"
source-file -F "#{@kit-dir}/conf.d/*.conf"
