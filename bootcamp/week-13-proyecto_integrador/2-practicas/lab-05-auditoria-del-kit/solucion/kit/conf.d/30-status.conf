# Usuario en la barra. Cada #() se relanza en cada refresco: con un comando
# lento, 5 s de intervalo y no 1 evita tenerlo siempre corriendo.
set -g status-interval 5
set -g status-right "#(sleep 1; whoami) "

# Dato lento (simula una consulta de red) guardado en una opción al cargar.
# -b: en segundo plano; sin él, tmux no termina de arrancar hasta que acaba.
run-shell -b 'sleep 1; tmux set -g @kit-weather soleado'
