# Kit mínimo de los labs 02 y 03: el mismo punto de entrada que tmux-kit.
# Se instala con ./install.sh (enlaza este directorio en ~/.config/tmux).

# Directorio real del kit, aunque tmux lo cargue a través de un enlace.
set -gF @kit-dir "#{d:current_file}"
source-file -F "#{@kit-dir}/conf.d/*.conf"
