<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Bootcamp tmux — Domina tu terminal">

  <!-- ── BACKGROUND ── -->
  <rect width="1200" height="280" fill="#0d1117"/>
  <rect x="0" y="0" width="5" height="280" fill="#3fb950"/>
  <rect x="5" y="0" width="1195" height="1" fill="#21262d"/>
  <rect x="5" y="279" width="1195" height="1" fill="#21262d"/>

  <!-- ── TERMINAL WINDOW ── -->
  <rect x="44" y="36" width="466" height="210" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="70" cy="57" r="5" fill="#ff5f57"/>
  <circle cx="88" cy="57" r="5" fill="#febc2e"/>
  <circle cx="106" cy="57" r="5" fill="#28c840"/>
  <text x="136" y="62" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#8b949e">tmux -L kit</text>
  <rect x="44" y="70" width="466" height="1" fill="#21262d"/>

  <!-- ── PANES: editor (left, active), shell (top right), logs (bottom right) ── -->
  <!-- vertical divider -->
  <rect x="300" y="71" width="1" height="151" fill="#3fb950"/>
  <!-- horizontal divider on the right side -->
  <rect x="301" y="146" width="209" height="1" fill="#30363d"/>

  <!-- left pane: tmux.conf -->
  <text x="58" y="92" font-family="'Courier New',Courier,monospace" font-size="12" fill="#ff7b72">set</text>
  <text x="88" y="92" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8b949e">-g</text>
  <text x="110" y="92" font-family="'Courier New',Courier,monospace" font-size="12" fill="#79c0ff">prefix</text>
  <text x="160" y="92" font-family="'Courier New',Courier,monospace" font-size="12" fill="#a5d6ff">C-a</text>

  <text x="58" y="110" font-family="'Courier New',Courier,monospace" font-size="12" fill="#ff7b72">setw</text>
  <text x="96" y="110" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8b949e">-g</text>
  <text x="118" y="110" font-family="'Courier New',Courier,monospace" font-size="12" fill="#79c0ff">mode-keys</text>
  <text x="194" y="110" font-family="'Courier New',Courier,monospace" font-size="12" fill="#a5d6ff">vi</text>

  <text x="58" y="128" font-family="'Courier New',Courier,monospace" font-size="12" fill="#ff7b72">bind</text>
  <text x="96" y="128" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8b949e">-r</text>
  <text x="118" y="128" font-family="'Courier New',Courier,monospace" font-size="12" fill="#a5d6ff">H</text>
  <text x="134" y="128" font-family="'Courier New',Courier,monospace" font-size="12" fill="#e6edf3">resize-pane -L 5</text>

  <text x="58" y="146" font-family="'Courier New',Courier,monospace" font-size="12" fill="#ff7b72">set</text>
  <text x="88" y="146" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8b949e">-g</text>
  <text x="110" y="146" font-family="'Courier New',Courier,monospace" font-size="12" fill="#79c0ff">status-right</text>

  <text x="70" y="164" font-family="'Courier New',Courier,monospace" font-size="12" fill="#a5d6ff">'#{?client_prefix,⌨ ,}#H'</text>

  <text x="58" y="182" font-family="'Courier New',Courier,monospace" font-size="12" fill="#ff7b72">source-file</text>
  <text x="146" y="182" font-family="'Courier New',Courier,monospace" font-size="12" fill="#a5d6ff">conf.d/*.conf</text>

  <!-- cursor -->
  <rect x="58" y="194" width="7" height="13" fill="#3fb950" opacity="0.9"/>

  <!-- top right pane: shell -->
  <text x="314" y="92" font-family="'Courier New',Courier,monospace" font-size="12" fill="#3fb950">$</text>
  <text x="326" y="92" font-family="'Courier New',Courier,monospace" font-size="12" fill="#e6edf3">bin/dev-up api</text>
  <text x="314" y="110" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8b949e">sesión api lista</text>
  <text x="314" y="128" font-family="'Courier New',Courier,monospace" font-size="12" fill="#3fb950">$</text>

  <!-- bottom right pane: list-sessions -->
  <text x="314" y="166" font-family="'Courier New',Courier,monospace" font-size="12" fill="#3fb950">$</text>
  <text x="326" y="166" font-family="'Courier New',Courier,monospace" font-size="12" fill="#e6edf3">tmux ls</text>
  <text x="314" y="184" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8b949e">api: 3 windows</text>
  <text x="314" y="202" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8b949e">notas: 1 windows</text>

  <!-- status line -->
  <rect x="45" y="222" width="464" height="23" fill="#3fb950"/>
  <text x="54" y="238" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="700" fill="#0d1117">[api]</text>
  <text x="102" y="238" font-family="'Courier New',Courier,monospace" font-size="12" fill="#0d1117">1:editor*  2:tests  3:logs</text>
  <text x="500" y="238" font-family="'Courier New',Courier,monospace" font-size="12" fill="#0d1117" text-anchor="end">bc-tmux-lab</text>

  <!-- ── RIGHT PANEL ── -->
  <text x="558" y="88" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#3fb950">BOOTCAMP</text>
  <text x="556" y="150" font-family="'Segoe UI',system-ui,sans-serif" font-size="54" font-weight="800" letter-spacing="1" fill="#e6edf3">tmux</text>
  <rect x="556" y="163" width="594" height="2" fill="#3fb950"/>
  <text x="558" y="193" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" font-weight="400" fill="#8b949e">Domina tu terminal — Zero to Advanced</text>

  <!-- ── STAT CARDS ── -->
  <rect x="558" y="218" width="108" height="40" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="612" y="233" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#8b949e" text-anchor="middle">SEMANAS</text>
  <text x="612" y="251" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" font-weight="800" fill="#e6edf3" text-anchor="middle">13</text>

  <rect x="678" y="218" width="108" height="40" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="732" y="233" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#8b949e" text-anchor="middle">HORAS</text>
  <text x="732" y="251" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" font-weight="800" fill="#e6edf3" text-anchor="middle">130</text>

  <rect x="798" y="218" width="108" height="40" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="852" y="233" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#8b949e" text-anchor="middle">LABS</text>
  <text x="852" y="251" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" font-weight="800" fill="#e6edf3" text-anchor="middle">78</text>

  <rect x="918" y="218" width="108" height="40" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="972" y="233" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#8b949e" text-anchor="middle">TMUX</text>
  <text x="972" y="251" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" font-weight="800" fill="#3fb950" text-anchor="middle">≥ 3.4</text>

  <rect x="1038" y="218" width="112" height="40" rx="4" fill="#3fb950"/>
  <text x="1094" y="234" font-family="'Courier New',Courier,monospace" font-size="11" font-weight="700" fill="#0d1117" text-anchor="middle">$ tmux new</text>
  <text x="1094" y="251" font-family="'Courier New',Courier,monospace" font-size="11" fill="#0d1117" text-anchor="middle">-s api</text>

</svg>
